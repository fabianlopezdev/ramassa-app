name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  quality-gates:
    runs-on: ubuntu-latest
    env:
      EXPO_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      EXPO_PUBLIC_SUPABASE_ANON_KEY: ci-anon-key
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Format check
        run: bun run format:check

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test

  accessibility-web:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Chromium
        run: bunx playwright install --with-deps chromium

      - name: Start seeded local services
        run: bunx supabase@2.90.0 start

      - name: Export generated local public key
        run: |
          bunx supabase@2.90.0 status -o env |
            sed -n 's/^ANON_KEY="\([^"]*\)"$/EXPO_PUBLIC_SUPABASE_ANON_KEY=\1/p' >> "$GITHUB_ENV"

      - name: WCAG 2.2 AA browser gate
        run: bun run qa:accessibility:web

      - name: Stop local services
        if: always()
        run: bunx supabase@2.90.0 stop
