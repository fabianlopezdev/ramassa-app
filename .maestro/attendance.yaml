appId: com.ramassa.app
name: attendance
env:
  DEV_CLIENT_URL: ramassa://expo-development-client/?url=http%3A%2F%2Flocalhost%3A8081
  DEV_MENU_LABEL: Developer menu
  LOCALE: ca
  STAFF_EMAIL: '{{staffOnly:email}}'
  LOGIN_TITLE: '{{auth:loginTitle}}'
  ATTENDANCE_TITLE: '{{attendance:title}}'
  ACCOUNTS_SECTION: Accounts and roles
  PUSH_DECLINE: '{{push:rationaleDecline}}'
---
- runFlow:
    file: _open-app.yaml
    env:
      DEV_CLIENT_URL: ${DEV_CLIENT_URL}
      DEV_MENU_LABEL: ${DEV_MENU_LABEL}
      LOCALE: ${LOCALE}
# `_sign-in.yaml` deliberately owns a player default, so its local env shadows a
# caller override. Attendance must exercise the actual server-backed staff role;
# select that fixture directly instead of accidentally proving the player shell.
- repeat:
    times: 6
    while:
      notVisible: '.*${ACCOUNTS_SECTION}.*'
    commands:
      - tapOn:
          text: '.*Close.*'
          optional: true
      - tapOn:
          text: '.*${DEV_MENU_LABEL}.*'
          optional: true
      - waitForAnimationToEnd:
          timeout: 3000
- extendedWaitUntil:
    visible: '.*${ACCOUNTS_SECTION}.*'
    timeout: 15000
- waitForAnimationToEnd:
    timeout: 5000
- repeat:
    times: 20
    while:
      notVisible: '.*${STAFF_EMAIL}.*'
    commands:
      - swipe:
          start: 50%, 70%
          end: 50%, 50%
          duration: 900
      - waitForAnimationToEnd:
          timeout: 2500
- swipe:
    start: 50%, 65%
    end: 50%, 55%
    duration: 900
- waitForAnimationToEnd:
    timeout: 2500
- tapOn: '.*${STAFF_EMAIL}.*'
# Let the password exchange, session callback and profile-role lookup all land
# before closing the menu. The previous three-second helper delay could only
# prove that the tap was dispatched, not that the staff session was active.
- waitForAnimationToEnd:
    timeout: 10000
- repeat:
    times: 6
    while:
      visible: '.*Close.*'
    commands:
      - tapOn:
          text: '.*Close.*'
          optional: true
      - waitForAnimationToEnd:
          timeout: 3000
- assertNotVisible: '.*${LOGIN_TITLE}.*'
- tapOn:
    text: '^${PUSH_DECLINE}$'
    optional: true
- waitForAnimationToEnd:
    timeout: 2500

- extendedWaitUntil:
    visible: '.*${ATTENDANCE_TITLE}.*'
    timeout: 30000
- tapOn: ".*Sessió d'entrenament d'avui.*"
- extendedWaitUntil:
    visible:
      id: attendance-player-5eed0000-0000-4000-8000-000000000011
    timeout: 30000
- assertVisible:
    id: attendance-status-5eed0000-0000-4000-8000-000000000011-present
- tapOn:
    id: attendance-player-5eed0000-0000-4000-8000-000000000011
- assertVisible:
    id: attendance-status-5eed0000-0000-4000-8000-000000000011-absent
- extendedWaitUntil:
    visible:
      id: attendance-sync-5eed0000-0000-4000-8000-000000000011-synced
    timeout: 30000
