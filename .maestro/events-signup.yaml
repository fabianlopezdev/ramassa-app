appId: com.ramassa.app
name: events-signup
# Calendar -> detail -> signup -> cold-relaunch -> same durable signup state.
env:
  DEV_CLIENT_URL: ramassa://expo-development-client/?url=http%3A%2F%2Flocalhost%3A8081
  BACK: '{{common:back}}'
  TAB_HOME: '{{nav:tabs.home}}'
  PUSH_DECLINE: '{{push:rationaleDecline}}'
  EVENTS_TAB: '{{nav:tabs.events}}'
  CALENDAR_VIEW_ACTION: '{{events:playerCalendarViewAction}}'
  CALENDAR_LABEL: '{{events:playerCalendarLabel}}'
  CONFIRM_ACTION: '{{events:playerConfirmAction}}'
  CANCEL_ACTION: '{{events:playerCancelAction}}'
  CONFIRMED_STATUS: '{{events:playerConfirmed}}'
---
- runFlow: _open-app.yaml
- runFlow: _sign-in.yaml
- runFlow: _relaunch.yaml

- repeat:
    times: 4
    while:
      notVisible:
        id: player-events-screen
    commands:
      - tapOn:
          text: '^${EVENTS_TAB}$'
          optional: true
      - waitForAnimationToEnd:
          timeout: 2500
- extendedWaitUntil:
    visible:
      id: player-events-screen
    timeout: 30000
- tapOn: '^${CALENDAR_VIEW_ACTION}$'
- assertVisible:
    text: '^${CALENDAR_VIEW_ACTION}$'
    selected: true
- extendedWaitUntil:
    visible:
      id: player-events-calendar
    timeout: 30000
- assertVisible: '.*${CALENDAR_LABEL}.*'

- repeat:
    times: 6
    while:
      notVisible:
        id: 'event-card-.*'
    commands:
      - swipe:
          start: 50%, 78%
          end: 50%, 52%
          duration: 800
      - waitForAnimationToEnd:
          timeout: 1200
- tapOn:
    id: 'event-card-.*'
    index: 0
# The selected calendar day is intentionally seeded with an active signup so
# the same flow proves both transitions. If a future fixture starts unsigned,
# this branch simply skips and confirmation remains the tested outcome.
- runFlow:
    when:
      notVisible: '^${CONFIRM_ACTION}$'
    commands:
      - tapOn: '^${CANCEL_ACTION}$'
      - extendedWaitUntil:
          visible: '^${CONFIRM_ACTION}$'
          timeout: 30000
- repeat:
    times: 6
    while:
      notVisible: '^${CONFIRM_ACTION}$'
    commands:
      - swipe:
          start: 50%, 78%
          end: 50%, 52%
          duration: 800
      - waitForAnimationToEnd:
          timeout: 1200
- tapOn: '^${CONFIRM_ACTION}$'
- extendedWaitUntil:
    visible: '.*${CONFIRMED_STATUS}.*'
    timeout: 30000

# A cold process start discards optimistic UI. Reaching the occurrence again
# proves the server write and query hydration, not the just-painted detail.
- runFlow: _relaunch.yaml
- repeat:
    times: 6
    while:
      notVisible:
        id: player-events-screen
    commands:
      - tapOn:
          text: '^${EVENTS_TAB}$'
          optional: true
      - waitForAnimationToEnd:
          timeout: 2500
- extendedWaitUntil:
    visible:
      id: player-events-screen
    timeout: 120000
- tapOn: '^${CALENDAR_VIEW_ACTION}$'
- extendedWaitUntil:
    visible:
      id: player-events-calendar
    timeout: 30000
- repeat:
    times: 6
    while:
      notVisible:
        id: 'event-card-.*'
    commands:
      - swipe:
          start: 50%, 78%
          end: 50%, 52%
          duration: 800
      - waitForAnimationToEnd:
          timeout: 1200
- tapOn:
    id: 'event-card-.*'
    index: 0
- repeat:
    times: 6
    while:
      notVisible: '.*${CONFIRMED_STATUS}.*'
    commands:
      - swipe:
          start: 50%, 78%
          end: 50%, 52%
          duration: 800
      - waitForAnimationToEnd:
          timeout: 1200
- assertVisible: '.*${CONFIRMED_STATUS}.*'
