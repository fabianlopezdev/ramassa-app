appId: com.ramassa.app
name: phase8-mentoring
env:
  LOCALE: ca
  TAB_CHAT: '{{nav:tabs.chat}}'
  PUSH_DECLINE: '{{push:rationaleDecline}}'
---
- runFlow: _open-app.yaml
- runFlow: _sign-in.yaml
- tapOn:
    text: '^${PUSH_DECLINE}$'
    optional: true
- runFlow:
    when:
      platform: Android
    commands:
      - tapOn: '^${TAB_CHAT}$'
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn:
          id: player-tab-chat
- extendedWaitUntil:
    visible:
      id: player-chat-tab
    timeout: 60000
- tapOn:
    id: chat-open-mentoring
- extendedWaitUntil:
    visible:
      id: mentoring-screen
    timeout: 30000
# The form opens in a sheet from the bottom button (RAPP-961).
- tapOn:
    id: mentoring-new
- extendedWaitUntil:
    visible:
      id: mentoring-form-sheet
    timeout: 10000
- tapOn:
    id: mentoring-topic-digital_skills
- repeat:
    times: 8
    while:
      notVisible:
        id: mentoring-detail
    commands:
      - swipe:
          start: 50%, 70%
          end: 50%, 45%
          duration: 700
- tapOn:
    id: mentoring-detail
- inputText: rapp61-private-mentoring
# iOS 27 no longer drops the keyboard when the screen is dragged, and the next
# control then sits behind it. The hide command works on both platforms.
- hideKeyboard
- repeat:
    times: 8
    while:
      notVisible:
        id: mentoring-preferred-date
    commands:
      - swipe:
          start: 50%, 70%
          end: 50%, 45%
          duration: 700
- tapOn:
    id: mentoring-preferred-date
- inputText: '2026-09-15'
- hideKeyboard
- repeat:
    times: 8
    while:
      notVisible:
        id: mentoring-preferred-time
    commands:
      - swipe:
          start: 50%, 70%
          end: 50%, 45%
          duration: 700
- tapOn:
    id: mentoring-preferred-time
- inputText: '10:30'
- hideKeyboard
- tapOn:
    id: mentoring-submit
- extendedWaitUntil:
    visible:
      id: mentoring-request-confirmation
    timeout: 30000
- repeat:
    times: 12
    while:
      notVisible:
        id: 'mentoring-request-.*'
    commands:
      - swipe:
          start: 50%, 75%
          end: 50%, 42%
          duration: 700
- assertVisible:
    id: 'mentoring-request-.*'
