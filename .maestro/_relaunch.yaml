appId: com.ramassa.app
name: _relaunch
# React Native applies a layout-direction flip on the NEXT start only, so any
# flow that changes language has to relaunch before it can assert on the result.
# Reused by every flow that needs the app in a known, settled, signed-in state.
# Callers must supply BACK, TAB_HOME, and PUSH_DECLINE in their current language;
# declaring localized defaults here would shadow `runFlow.env` overrides.
env:
  DEV_CLIENT_URL: ramassa://expo-development-client/?url=http%3A%2F%2Flocalhost%3A8081
---
- stopApp
- openLink: ${DEV_CLIENT_URL}
# iOS asks "Open in <app>?" before it will follow a custom-scheme link, and
# nothing dismisses that for you: the app never opens and the flow times out on
# its first assertion, which reads as a bundle that would not load. Optional so
# the identical line is a harmless no-op on Android, which does not ask.
- tapOn:
    text: '^Open$'
    optional: true
- waitForAnimationToEnd:
    timeout: 3000
# Here the loop condition is the signed-in TAB SHELL, not the sheet: after a relaunch the
# Android emulator takes minutes to reload the bundle and the client's explainer
# lands whenever it lands, so any fixed wait either fires before it or wastes
# time after it. Sign-in can also restore a pushed player route whose tab bar is
# intentionally hidden; backing out makes this shared fragment's promised known
# shell state deterministic without treating that valid route as an auth failure.
- waitForAnimationToEnd:
    timeout: 12000
- runFlow:
    when:
      platform: Android
    commands:
      - repeat:
          times: 10
          while:
            notVisible: '^${TAB_HOME}$'
          commands:
            - tapOn:
                text: '.*Close.*'
                optional: true
            - tapOn:
                text: '^${PUSH_DECLINE}$'
                optional: true
            - waitForAnimationToEnd:
                timeout: 1000
            - tapOn:
                id: knowledge-back
                point: 50%, 50%
                optional: true
            - tapOn:
                text: '^${BACK}$'
                optional: true
            - waitForAnimationToEnd:
                timeout: 3000
# NativeTabs exposes its testID to XCUITest. Use that stable identifier on iOS:
# exact Arabic tab text is visually correct but carries bidi metadata in the
# accessibility tree, so a literal regex can fail while the label is on screen.
- runFlow:
    when:
      platform: iOS
    commands:
      - repeat:
          times: 10
          while:
            notVisible:
              id: player-tab-home
          commands:
            - tapOn:
                text: '.*Close.*'
                optional: true
            - tapOn:
                text: '^${PUSH_DECLINE}$'
                optional: true
            - waitForAnimationToEnd:
                timeout: 1000
            # Maestro can see this GestureDetector-backed control in the iOS
            # tree, but default accessibility activation does not dispatch it.
            - tapOn:
                id: knowledge-back
                point: 50%, 50%
                optional: true
            - tapOn:
                text: '^${BACK}$'
                optional: true
            - waitForAnimationToEnd:
                timeout: 3000
# The loop above exits on the FIRST frame showing home, but the client's
# explainer lands seconds AFTER the first render: it then covers the screen and
# the wait below sits out its full timeout on a home screen that is there and
# hidden. Sweep once more for a late sheet before asserting.
- repeat:
    times: 4
    while:
      visible: '.*Close.*'
    commands:
      - tapOn:
          text: '.*Close.*'
      - waitForAnimationToEnd:
          timeout: 3000
# A late sheet can hide Knowledge while the loop samples Home for one frame.
# Unwind once more after the sheet is gone before making the root-shell claim.
- tapOn:
    id: knowledge-back
    point: 50%, 50%
    optional: true
- tapOn:
    text: '^${BACK}$'
    optional: true
- waitForAnimationToEnd:
    timeout: 3000
- runFlow:
    when:
      platform: Android
    commands:
      - extendedWaitUntil:
          visible: '^${TAB_HOME}$'
          timeout: 240000
- runFlow:
    when:
      platform: iOS
    commands:
      - extendedWaitUntil:
          visible:
            id: player-tab-home
          timeout: 240000
