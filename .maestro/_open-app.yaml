appId: com.ramassa.app
name: _open-app
# A fragment, not a flow: every smoke flow starts here. Leading underscore so it
# reads as a subflow rather than a suite member.
#
# Everything in this file is a workaround for the app under test being a
# DEVELOPMENT build, which it has to be: the dev menu is what signs a flow in as
# a seeded player and what pins the capture language, and both are __DEV__ only.
#
# `bun run qa:smoke` rewrites the env block below before running (a flow's own
# env wins over `maestro -e`, so the values must be baked in).
env:
  DEV_CLIENT_URL: ramassa://expo-development-client/?url=http%3A%2F%2Flocalhost%3A8082
  DEV_MENU_LABEL: Developer menu
  DEV_MENU_LINK: ramassa://dev-menu
  LOCALE: ca
---
# Clean install every run, so a smoke result never depends on what the previous
# run left behind. The launch is a deep link because a plain `launchApp` lands on
# the launcher's "searching for development servers" screen.
- clearState
- openLink: ${DEV_CLIENT_URL}
# iOS asks "Open in <app>?" before it will follow a custom-scheme link, and
# nothing dismisses that for you: the app never opens and the flow times out on
# its first assertion, which reads as a bundle that would not load. Optional so
# the identical line is a harmless no-op on Android, which does not ask.
- tapOn:
    text: '^Open$'
    optional: true
- waitForAnimationToEnd:
    timeout: 3000

# Android can occasionally accept the custom-scheme dispatch but leave the
# launcher in front. Retry the same explicit app link until the app surface is
# present. On iOS the optional Open action handles the system confirmation on
# every attempt.
#
# The app surface is the pre-auth language screen (RAPP-115), which a clean
# install always opens on. Its heading is keyed by testID because its text is
# in the device's language until a language is chosen.
- repeat:
    times: 3
    while:
      notVisible:
        id: language-heading
    commands:
      - openLink: ${DEV_CLIENT_URL}
      - tapOn:
          text: '^Open$'
          optional: true
      - waitForAnimationToEnd:
          timeout: 5000

# First launch after a state clear downloads the JS bundle, hence minutes.
# Waited for in a loop rather than one long wait, because two things can stand
# between the launch and the language screen on a busy Mac (RAPP-500): the
# "Open in" confirmation can appear after the optional tap above has given up,
# and a clean install has come up on the developer menu, signed out, instead
# of its root. Each pass answers the one and closes the other.
- repeat:
    times: 40
    while:
      notVisible:
        id: language-heading
    commands:
      - tapOn:
          text: '^Open$'
          optional: true
      - tapOn:
          id: dev-menu-close
          optional: true
      - waitForAnimationToEnd:
          timeout: 5000
- extendedWaitUntil:
    visible:
      id: language-heading
    timeout: 30000

# The development client shows an explainer sheet for its OWN menu a second or
# two AFTER the app renders, so the wait below is waiting for it to APPEAR.
# Dismiss by the ✕ ("Close" on both platforms), never by "Continue" (that opens
# the client's tools menu) and never by the backdrop (a no-op on Android).
- waitForAnimationToEnd:
    timeout: 12000
- repeat:
    times: 4
    while:
      visible: '.*Close.*'
    commands:
      - tapOn:
          text: '.*Close.*'
      - waitForAnimationToEnd:
          timeout: 3000

# Since RAPP-115 a clean install asks for a language once the client's sheet
# is closed, and that screen hides the developer menu. Catalan is the suite's
# language and keeps the layout left to right, so no restart follows. The
# button reads "Continua" once Catalan is chosen. The developer menu's entry
# now sits on the signed-in Profile tab only, so the menu is opened by its own
# route.
- repeat:
    times: 40
    while:
      notVisible: '.*${DEV_MENU_LABEL}.*'
    commands:
      - tapOn:
          text: '^Català$'
          optional: true
      - tapOn:
          text: '^(Continua|Continue)$'
          optional: true
      - waitForAnimationToEnd:
          timeout: 3000
      - openLink: ${DEV_MENU_LINK}
      - waitForAnimationToEnd:
          timeout: 3000
- extendedWaitUntil:
    visible: '.*${DEV_MENU_LABEL}.*'
    timeout: 240000

# Language before assertions, never after: `clearState` leaves no persisted
# choice, so until this runs the app is in the DEVICE's language and every
# selector the suite resolved from Catalan misses.
- runFlow:
    file: _set-language.yaml
    env:
      LOCALE: ${LOCALE}
