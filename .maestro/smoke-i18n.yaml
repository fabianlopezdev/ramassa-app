appId: com.ramassa.app
name: smoke-i18n
# Catalan -> Arabic -> Catalan, asserting the two things that actually break.
#
# 1. The LANGUAGE applied: the tab bar comes back in Arabic script, which also
#    proves the bundled Arabic font resolved (a missing family shows as tofu, not
#    as an error).
# 2. The DIRECTION applied: React Native only flips layout direction on the next
#    app start, so a switch that looks fine in the moment can be wrong until a
#    relaunch. The dev menu renders "Native layout direction matches the
#    language." only when `I18nManager.isRTL` agrees with the resolved language,
#    so asserting that string after a relaunch is a direct check that RTL took.
#
# Both directions are exercised: a switch that cannot be undone is its own bug.
env:
  DEV_CLIENT_URL: ramassa://expo-development-client/?url=http%3A%2F%2Flocalhost%3A8081
  DEV_MENU_LABEL: Developer menu
  # Parenthesis-free on purpose: these values are treated as REGEX, so the
  # brackets in the rendered "rtl (native matches)" would be a capture group and
  # the pattern would only match text without them.
  DIRECTION_OK: native matches
  MENU_SECTION: Environment
  TAB_HOME_CA: '{{nav:tabs.home}}'
  TAB_HOME_AR: الرئيسية
  TAB_EVENTS_AR: الفعاليات
  TAB_PROFILE_CA: '{{nav:tabs.profile}}'
  # The profile screen's own heading, used to confirm the tab actually changed
  # before scrolling down it. Not the tab label: that is on screen whichever tab
  # is showing, so it cannot tell one from another.
  PROFILE_TITLE: '{{profile:title}}'
  PUSH_DECLINE: '{{push:rationaleDecline}}'
  # Hardcoded, like the Arabic tab labels above. This suite resolves its
  # selectors from the CATALAN catalog, so once the app is in Arabic the
  # notifications prompt cannot be matched by key, and it reappears after every
  # relaunch covering the tab bar being asserted.
  PUSH_DECLINE_AR: ليس الآن
---
- runFlow: _open-app.yaml
- runFlow: _sign-in.yaml
- runFlow: _relaunch.yaml

# Baseline: Catalan, left to right.
- assertVisible:
    text: '^${TAB_HOME_CA}$'

# Switch to Arabic from the dev menu on the profile tab.
# Reaching Profile is a LOOP, verified by the dev-menu entry, which is rendered
# on Profile and nowhere else in the signed-in shell. A single tab tap can land
# on the WRONG tab: the tab bar is a floating pill that animates into place after
# a relaunch, and a touch dispatched against its pre-settle layout selects a
# neighbour. Twice this put the app on Comunitat, where there is no dev-menu
# entry, so the next six attempts to open the menu had nothing to tap and the
# failure surfaced as "the menu will not open".
#
# The dev-menu entry is also the LAST thing on the profile screen, and since the
# profile tab stopped being a placeholder it sits well below the fold: the
# hierarchy Maestro matches against on Android excludes off-screen nodes (it logs
# them as "Skipping invisible child"), so tapping the tab is no longer enough to
# make the entry matchable. This flow was written when that tab was empty, which
# is why it never needed to scroll before.
#
# So: reach the tab first, keyed on the profile TITLE, which is at the top of
# the screen and on no other tab. Then scroll to the entry.
- repeat:
    times: 6
    while:
      notVisible: '.*${PROFILE_TITLE}.*'
    commands:
      - tapOn:
          text: '^${TAB_PROFILE_CA}$'
          optional: true
      - waitForAnimationToEnd:
          timeout: 3000
- extendedWaitUntil:
    visible: '.*${PROFILE_TITLE}.*'
    timeout: 15000
# iOS keeps off-screen descendants in its accessibility hierarchy, so the
# conditional loop below can claim the last profile row is visible while it is
# still several screens below the viewport. Scroll to the bottom without a
# condition first. Android stops harmlessly at the same bottom edge.
- repeat:
    times: 10
    commands:
      - swipe:
          start: 50%, 65%
          end: 50%, 35%
          duration: 400
- waitForAnimationToEnd:
    timeout: 2000
- repeat:
    times: 12
    while:
      notVisible: '.*${DEV_MENU_LABEL}.*'
    commands:
      - swipe:
          start: 50%, 65%
          end: 50%, 35%
          duration: 900
      - waitForAnimationToEnd:
          timeout: 1500
# The loop stops the instant a sliver is on screen, which parks the entry under
# the tab bar where a tap does not reach it. One smaller swipe lifts it clear.
- swipe:
    start: 50%, 60%
    end: 50%, 50%
    duration: 900
- waitForAnimationToEnd:
    timeout: 2000
- extendedWaitUntil:
    visible: '.*${DEV_MENU_LABEL}.*'
    timeout: 15000
# Opening the dev menu is a LOOP that confirms it actually opened. A bare tap can
# be swallowed, and the cost here is not a missed tap: the swipes below then land
# on the APP instead of the menu, scrolling and switching tabs, and the flow ends
# up asserting against a screen it never meant to be on. The signal is the close
# control, which is pinned to the menu header and cannot scroll out of view the
# way a section title can.
- repeat:
    times: 6
    while:
      notVisible: '.*Close.*'
    commands:
      - tapOn:
          text: '.*${DEV_MENU_LABEL}.*'
          optional: true
      - waitForAnimationToEnd:
          timeout: 3000
# Settle before asserting. The loop exits on the first sampled frame showing the
# close control, which during the sheet's open animation is a frame the UI has
# not finished committing.
- waitForAnimationToEnd:
    timeout: 3000
- extendedWaitUntil:
    visible: '.*Close.*'
    timeout: 15000
- waitForAnimationToEnd:
    timeout: 5000
- repeat:
    times: 20
    while:
      notVisible: '^ar \(rtl\)$'
    commands:
      - swipe:
          start: 50%, 70%
          end: 50%, 50%
          duration: 900
      - waitForAnimationToEnd:
          timeout: 2500
# No settle swipe before the tap. The loop above already stopped WITH the button
# on screen, and an unconditional extra swipe moves it between the moment Maestro
# resolves its bounds and the moment the touch lands: that is how a tap on
# `ca (ltr)` reported COMPLETED and selected a different language.
# Settle before the tap. In the mirrored RTL layout the language buttons wrap
# onto two rows and `ca (ltr)` sits DIRECTLY ABOVE `fa (rtl)` in the same column
# (measured: ca [800,1955][994,2081], fa [806,2102][994,2228]). Bounds resolved
# while the list is still easing therefore put the touch one row low, and the tap
# reports COMPLETED having selected a different language. The `selected` check
# below is what catches it when this is not enough.
- waitForAnimationToEnd:
    timeout: 3000
- tapOn:
    text: '^ar \(rtl\)$'
- waitForAnimationToEnd:
    timeout: 3000
# Assert WHAT was selected, immediately. A tap that reports COMPLETED has only
# proved Maestro found the element and dispatched a touch at its reported
# bounds; it has not proved the touch landed on that button. Checking here fails
# on the tap, with the real selection in the artifact, instead of surfacing much
# later as a tab bar in the wrong language.
- assertVisible:
    text: '^ar \(rtl\)$'
    selected: true

# Relaunch, then assert the language AND the direction both took.
- stopApp
- openLink: ${DEV_CLIENT_URL}
# iOS asks "Open in <app>?" before it will follow a custom-scheme link, and
# nothing dismisses that for you: the app never opens and the flow times out on
# its first assertion, which reads as a bundle that would not load. Optional so
# the identical line is a harmless no-op on Android, which does not ask.
- tapOn:
    text: '^Open$'
    optional: true
- waitForAnimationToEnd:
    timeout: 3000
- waitForAnimationToEnd:
    timeout: 12000
- repeat:
    times: 10
    while:
      notVisible: '^${TAB_HOME_AR}$'
    commands:
      - tapOn:
          text: '.*Close.*'
          optional: true
      - tapOn:
          text: '^${PUSH_DECLINE_AR}$'
          optional: true
      - tapOn:
          text: '^${PUSH_DECLINE}$'
          optional: true
      - waitForAnimationToEnd:
          timeout: 3000
- extendedWaitUntil:
    visible: '^${TAB_HOME_AR}$'
    timeout: 240000
- assertVisible:
    text: '^${TAB_EVENTS_AR}$'
- assertNotVisible:
    text: '^${TAB_HOME_CA}$'

# The direction readout lives in the dev menu, which is now reached through the
# Arabic profile tab. Scrolled to the entry for the same reason as the Catalan
# pass above: the profile screen has real content now, so its dev-menu entry is
# below the fold and off-screen nodes are not matchable on Android.
- tapOn:
    text: '^الملف الشخصي$'
- waitForAnimationToEnd:
    timeout: 3000
# As in the Catalan pass, iOS exposes the off-screen developer-menu row to the
# hierarchy. Reach the physical bottom before asking whether the row is visible,
# otherwise its off-screen coordinates can land on a neighboring tab.
- repeat:
    times: 10
    commands:
      - swipe:
          start: 50%, 65%
          end: 50%, 35%
          duration: 400
- waitForAnimationToEnd:
    timeout: 2000
- repeat:
    times: 12
    while:
      notVisible: '.*${DEV_MENU_LABEL}.*'
    commands:
      - swipe:
          start: 50%, 65%
          end: 50%, 35%
          duration: 900
      - waitForAnimationToEnd:
          timeout: 1500
- swipe:
    start: 50%, 60%
    end: 50%, 50%
    duration: 900
- waitForAnimationToEnd:
    timeout: 2000
# Opening the dev menu is a LOOP that confirms it actually opened. A bare tap can
# be swallowed, and the cost here is not a missed tap: the swipes below then land
# on the APP instead of the menu, scrolling and switching tabs, and the flow ends
# up asserting against a screen it never meant to be on. The signal is the close
# control, which is pinned to the menu header and cannot scroll out of view the
# way a section title can.
- repeat:
    times: 6
    while:
      notVisible: '.*${MENU_SECTION}.*'
    commands:
      - tapOn:
          text: '.*${DEV_MENU_LABEL}.*'
          optional: true
      - waitForAnimationToEnd:
          timeout: 3000
# Settle, then scroll BLIND to the top before asserting anything. The loop above
# only proves the menu is open somewhere: on Android the menu reopens at its
# preserved scroll position (here, the language section the flow left it at
# before the relaunch), and the hierarchy reports off-screen rows as present, so
# any condition-driven scroll believes it has already arrived. A fixed count of
# downward drags needs no condition and cannot be fooled; iOS is unaffected
# because its fresh push resets scroll, and the extra drags are a no-op at the
# top. Keyed on the SECTION, not the close control, because in RTL on Android
# the menu renders no header at all (RAPP-93).
- waitForAnimationToEnd:
    timeout: 3000
- repeat:
    times: 10
    commands:
      - swipe:
          start: 50%, 40%
          end: 50%, 70%
          duration: 400
- waitForAnimationToEnd:
    timeout: 3000
# Wait for the READOUT, not the section title above it. The blind scroll can end
# a few rows shy of the very top, which leaves the title just above the fold
# while the direction row - the only thing this flow is here to check - is
# plainly on screen. Asserting the title failed a run whose screenshot showed
# `rtl (native matches)` in full view.
- extendedWaitUntil:
    visible: '.*${DIRECTION_OK}.*'
    timeout: 15000
# Redundant second wait on the readout, kept deliberately: the wait above can be
# satisfied at the tail of the blind scroll, and this one confirms the readout is
# still on screen once everything has settled. It passes instantly when it is.
- waitForAnimationToEnd:
    timeout: 5000
- extendedWaitUntil:
    visible: '.*${DIRECTION_OK}.*'
    timeout: 15000

# And back to Catalan, so the suite leaves the device as it found it.
- repeat:
    times: 20
    while:
      notVisible: '^ca \(ltr\)$'
    commands:
      - swipe:
          start: 50%, 70%
          end: 50%, 50%
          duration: 900
      - waitForAnimationToEnd:
          timeout: 2500
# No settle swipe before the tap. The loop above already stopped WITH the button
# on screen, and an unconditional extra swipe moves it between the moment Maestro
# resolves its bounds and the moment the touch lands: that is how a tap on
# `ca (ltr)` reported COMPLETED and selected a different language.
# Settle before the tap. In the mirrored RTL layout the language buttons wrap
# onto two rows and `ca (ltr)` sits DIRECTLY ABOVE `fa (rtl)` in the same column
# (measured: ca [800,1955][994,2081], fa [806,2102][994,2228]). Bounds resolved
# while the list is still easing therefore put the touch one row low, and the tap
# reports COMPLETED having selected a different language. The `selected` check
# below is what catches it when this is not enough.
- waitForAnimationToEnd:
    timeout: 3000
# Tap UNTIL selected, not tap-then-assert. In the mirrored layout these small
# wrapped buttons drift between bounds-resolve and touch, and a tap that lands
# in the padding between rows reports COMPLETED having changed nothing. The
# loop's condition IS the outcome, so it cannot exit without the selection
# actually changing.
- repeat:
    times: 6
    while:
      notVisible:
        text: '^ca \(ltr\)$'
        selected: true
    commands:
      - tapOn:
          text: '^ca \(ltr\)$'
          optional: true
      - waitForAnimationToEnd:
          timeout: 2500
# Assert WHAT was selected, immediately. A tap that reports COMPLETED has only
# proved Maestro found the element and dispatched a touch at its reported
# bounds; it has not proved the touch landed on that button. Checking here fails
# on the tap, with the real selection in the artifact, instead of surfacing much
# later as a tab bar in the wrong language.
- assertVisible:
    text: '^ca \(ltr\)$'
    selected: true
- stopApp
- openLink: ${DEV_CLIENT_URL}
# iOS asks "Open in <app>?" before it will follow a custom-scheme link, and
# nothing dismisses that for you: the app never opens and the flow times out on
# its first assertion, which reads as a bundle that would not load. Optional so
# the identical line is a harmless no-op on Android, which does not ask.
- tapOn:
    text: '^Open$'
    optional: true
- waitForAnimationToEnd:
    timeout: 3000
- waitForAnimationToEnd:
    timeout: 12000
- repeat:
    times: 10
    while:
      notVisible: '^${TAB_HOME_CA}$'
    commands:
      - tapOn:
          text: '.*Close.*'
          optional: true
      - tapOn:
          text: '^${PUSH_DECLINE_AR}$'
          optional: true
      - tapOn:
          text: '^${PUSH_DECLINE}$'
          optional: true
      - waitForAnimationToEnd:
          timeout: 3000
- extendedWaitUntil:
    visible: '^${TAB_HOME_CA}$'
    timeout: 240000
