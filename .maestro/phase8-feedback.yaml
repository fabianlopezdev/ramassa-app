appId: com.ramassa.app
name: phase8-feedback
env:
  LOCALE: ca
  TAB_CHAT: '{{nav:tabs.chat}}'
  PUSH_DECLINE: '{{push:rationaleDecline}}'
---
- runFlow: _open-app.yaml
- runFlow: _sign-in.yaml
- tapOn:
    text: '^${PUSH_DECLINE}$'
    optional: true
- runFlow:
    when:
      platform: Android
    commands:
      - tapOn: '^${TAB_CHAT}$'
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn:
          id: player-tab-chat
- extendedWaitUntil:
    visible:
      id: player-chat-tab
    timeout: 60000
- tapOn:
    id: chat-open-feedback
- extendedWaitUntil:
    visible:
      id: feedback-screen
    timeout: 30000
# Each suggestion opens the form in a sheet from the bottom button (RAPP-961).
- tapOn:
    id: feedback-new
- extendedWaitUntil:
    visible:
      id: feedback-form-sheet
    timeout: 10000
- tapOn:
    id: feedback-type-activity_proposal
- tapOn:
    id: feedback-content
- inputText: rapp61-activity-proposal
- hideKeyboard
- tapOn:
    id: feedback-submit
- extendedWaitUntil:
    notVisible:
      id: feedback-form-sheet
    timeout: 30000
- extendedWaitUntil:
    visible:
      id: feedback-confirmation
    timeout: 30000
- tapOn:
    id: feedback-new
- extendedWaitUntil:
    visible:
      id: feedback-form-sheet
    timeout: 10000
- tapOn:
    id: feedback-type-idea
- tapOn:
    id: feedback-content
- inputText: rapp61-idea
- hideKeyboard
- tapOn:
    id: feedback-submit
- extendedWaitUntil:
    notVisible:
      id: feedback-form-sheet
    timeout: 30000
- extendedWaitUntil:
    visible:
      id: feedback-confirmation
    timeout: 30000
- tapOn:
    id: feedback-new
- extendedWaitUntil:
    visible:
      id: feedback-form-sheet
    timeout: 10000
- tapOn:
    id: feedback-type-problem
- tapOn:
    id: feedback-content
- inputText: rapp61-problem
- hideKeyboard
- tapOn:
    id: feedback-submit
- extendedWaitUntil:
    notVisible:
      id: feedback-form-sheet
    timeout: 30000
- extendedWaitUntil:
    visible:
      id: feedback-confirmation
    timeout: 30000
- tapOn:
    id: feedback-new
- extendedWaitUntil:
    visible:
      id: feedback-form-sheet
    timeout: 10000
- tapOn:
    id: feedback-type-general
- tapOn:
    id: feedback-content
- inputText: rapp61-general
- hideKeyboard
- tapOn:
    id: feedback-submit
- extendedWaitUntil:
    notVisible:
      id: feedback-form-sheet
    timeout: 30000
- extendedWaitUntil:
    visible:
      id: feedback-confirmation
    timeout: 30000
