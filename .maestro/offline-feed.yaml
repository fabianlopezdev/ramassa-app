appId: com.ramassa.app
name: offline-feed
# Android exercises real airplane mode after the feed has hydrated. Maestro's
# command is harmless on iOS, where the cumulative suite still proves launch.
env:
  DEV_CLIENT_URL: ramassa://expo-development-client/?url=http%3A%2F%2Flocalhost%3A8081
  BACK: '{{common:back}}'
  TAB_HOME: '{{nav:tabs.home}}'
  PUSH_DECLINE: '{{push:rationaleDecline}}'
  OFFLINE_BANNER: '{{home:offlineBanner}}'
  PINNED: '{{home:pinned}}'
  HOME_TITLE: '{{home:feedTitle}}'
---
- runFlow: _open-app.yaml
- runFlow: _sign-in.yaml
- runFlow: _relaunch.yaml
- extendedWaitUntil:
    visible: '.*${HOME_TITLE}.*'
    timeout: 120000
- repeat:
    times: 8
    while:
      notVisible: '.*${PINNED}.*'
    commands:
      - swipe:
          start: 50%, 70%
          end: 50%, 45%
          duration: 700
      - waitForAnimationToEnd:
          timeout: 1200
- assertVisible: '.*${PINNED}.*'
- runFlow:
    when:
      platform: Android
    commands:
      - toggleAirplaneMode
      - extendedWaitUntil:
          visible: '.*${OFFLINE_BANNER}.*'
          timeout: 30000
      - repeat:
          times: 8
          while:
            notVisible: '.*${PINNED}.*'
          commands:
            - swipe:
                start: 50%, 70%
                end: 50%, 45%
                duration: 700
            - waitForAnimationToEnd:
                timeout: 1200
      - assertVisible: '.*${PINNED}.*'
      - toggleAirplaneMode
      - repeat:
          times: 8
          commands:
            - swipe:
                start: 50%, 22%
                end: 50%, 82%
                duration: 700
            - waitForAnimationToEnd:
                timeout: 900
      - extendedWaitUntil:
          notVisible: '.*${OFFLINE_BANNER}.*'
          timeout: 30000
