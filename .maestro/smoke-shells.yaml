appId: com.ramassa.app
name: smoke-shells
# Every player tab is reachable and renders its labelled screen. This is the
# regression net under the navigation shell: five tabs, each with an icon AND a
# text label (icon-only fails low-literacy users, text-only fails non-native
# speakers), and nothing crashing on the way round.
env:
  DEV_CLIENT_URL: ramassa://expo-development-client/?url=http%3A%2F%2Flocalhost%3A8081
  BACK: '{{common:back}}'
  PUSH_DECLINE: '{{push:rationaleDecline}}'
  DEV_MENU_LABEL: Developer menu
  HOME_FEED_TITLE: '{{home:feedTitle}}'
  COMMUNITY_TITLE: '{{nav:tabs.community}}'
  TAB_HOME: '{{nav:tabs.home}}'
  TAB_EVENTS: '{{nav:tabs.events}}'
  TAB_CHAT: '{{nav:tabs.chat}}'
  TAB_COMMUNITY: '{{nav:tabs.community}}'
  TAB_SERVICES: '{{nav:tabs.services}}'
---
- runFlow: _open-app.yaml
- runFlow: _sign-in.yaml
- runFlow: _relaunch.yaml

# Maestro uses the hierarchy for navigation below. After this flow completes,
# qa-smoke captures the real Android framebuffer and OCRs the five label slots.
# Hierarchy visibility is not accepted as evidence that Material painted text.

# Each tab opens and renders its own header. Community has a unique heading.
# Activitats, Xat and Services repeat their tab label as the screen title, so
# `index: 1` proves a second match (the screen heading) exists; without the
# index, the tab-bar label would satisfy the assertion before the tap happened.
- tapOn:
    text: '^${TAB_EVENTS}$'
- extendedWaitUntil:
    visible:
      text: '^${TAB_EVENTS}$'
      index: 1
    timeout: 15000
- tapOn:
    id: player-tab-chat
- extendedWaitUntil:
    visible:
      text: '^${TAB_CHAT}$'
      index: 1
    timeout: 15000
- runFlow:
    when:
      platform: Android
    commands:
      - tapOn:
          text: '^${TAB_COMMUNITY}$'
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn:
          id: player-tab-community
- extendedWaitUntil:
    visible: '.*${COMMUNITY_TITLE}.*'
    timeout: 15000
- tapOn:
    text: '^${TAB_SERVICES}$'
- extendedWaitUntil:
    visible:
      text: '^${TAB_SERVICES}$'
      index: 1
    timeout: 15000
- tapOn:
    text: '^${TAB_HOME}$'
- extendedWaitUntil:
    visible: '.*${HOME_FEED_TITLE}.*'
    timeout: 15000
# The profile left the tab bar: it opens from her photo at the top of every tab.
- assertVisible:
    id: player-profile-button
