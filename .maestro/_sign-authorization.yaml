appId: com.ramassa.app
name: _sign-authorization
# A fragment: signs the season authorization (RAPP-304) with the shortest
# lawful path. A new player meets it right after the wizard, before the tabs.
# The medical answer is "No", the four required consents are ticked and she
# signs with the ticks alone ("I cannot draw"), because Maestro cannot draw a
# signature reliably on both platforms. Every tap is "until checked": a tap
# that only reports COMPLETED proves nothing about the state it changed.
# These are radios and ticks, which Android reports as checked, not selected.
---
- extendedWaitUntil:
    visible:
      id: 'authorization-screen'
    timeout: 60000
- waitForAnimationToEnd:
    timeout: 3000
# Continue reads the document; consent is selected only on the final screen.
# Continue may still be settling when first tapped, so it is pressed until
# the second screen shows, scrolling to its medical question in between.
- repeat:
    times: 15
    while:
      notVisible:
        id: 'authorization-health-no'
    commands:
      - tapOn:
          id: 'authorization-sign'
          optional: true
      - waitForAnimationToEnd:
          timeout: 1500
      - runFlow:
          when:
            notVisible:
              id: 'authorization-health-no'
          commands:
            - swipe:
                start: 50%, 60%
                end: 50%, 25%
                duration: 600
            - waitForAnimationToEnd:
                timeout: 1200
- repeat:
    times: 4
    while:
      notVisible:
        id: 'authorization-health-no'
        checked: true
    commands:
      - tapOn:
          id: 'authorization-health-no'
          optional: true
      - waitForAnimationToEnd:
          timeout: 1500
- assertVisible:
    id: 'authorization-health-no'
    checked: true
- tapOn:
    id: 'authorization-sign'
- waitForAnimationToEnd:
    timeout: 1500
- repeat:
    times: 15
    while:
      notVisible:
        id: 'authorization-consent-participation'
    commands:
      - swipe:
          start: 50%, 60%
          end: 50%, 25%
          duration: 600
      - waitForAnimationToEnd:
          timeout: 1200
- repeat:
    times: 4
    while:
      notVisible:
        id: 'authorization-consent-participation'
        checked: true
    commands:
      - tapOn:
          id: 'authorization-consent-participation'
          optional: true
      - waitForAnimationToEnd:
          timeout: 1500
- assertVisible:
    id: 'authorization-consent-participation'
    checked: true
- repeat:
    times: 15
    while:
      notVisible:
        id: 'authorization-consent-data_processing'
    commands:
      - swipe:
          start: 50%, 60%
          end: 50%, 25%
          duration: 600
      - waitForAnimationToEnd:
          timeout: 1200
- repeat:
    times: 4
    while:
      notVisible:
        id: 'authorization-consent-data_processing'
        checked: true
    commands:
      - tapOn:
          id: 'authorization-consent-data_processing'
          optional: true
      - waitForAnimationToEnd:
          timeout: 1500
- assertVisible:
    id: 'authorization-consent-data_processing'
    checked: true
- repeat:
    times: 15
    while:
      notVisible:
        id: 'authorization-consent-code_of_conduct'
    commands:
      - swipe:
          start: 50%, 60%
          end: 50%, 25%
          duration: 600
      - waitForAnimationToEnd:
          timeout: 1200
- repeat:
    times: 4
    while:
      notVisible:
        id: 'authorization-consent-code_of_conduct'
        checked: true
    commands:
      - tapOn:
          id: 'authorization-consent-code_of_conduct'
          optional: true
      - waitForAnimationToEnd:
          timeout: 1500
- assertVisible:
    id: 'authorization-consent-code_of_conduct'
    checked: true
- repeat:
    times: 15
    while:
      notVisible:
        id: 'authorization-consent-health_data'
    commands:
      - swipe:
          start: 50%, 60%
          end: 50%, 25%
          duration: 600
      - waitForAnimationToEnd:
          timeout: 1200
- repeat:
    times: 4
    while:
      notVisible:
        id: 'authorization-consent-health_data'
        checked: true
    commands:
      - tapOn:
          id: 'authorization-consent-health_data'
          optional: true
      - waitForAnimationToEnd:
          timeout: 1500
- assertVisible:
    id: 'authorization-consent-health_data'
    checked: true
- repeat:
    times: 15
    while:
      notVisible:
        id: 'authorization-cannot-draw'
    commands:
      - swipe:
          start: 50%, 60%
          end: 50%, 25%
          duration: 600
      - waitForAnimationToEnd:
          timeout: 1200
- repeat:
    times: 4
    while:
      notVisible:
        id: 'authorization-cannot-draw'
        checked: true
    commands:
      - tapOn:
          id: 'authorization-cannot-draw'
          optional: true
      - waitForAnimationToEnd:
          timeout: 1500
- assertVisible:
    id: 'authorization-cannot-draw'
    checked: true
- repeat:
    times: 15
    while:
      notVisible:
        id: 'authorization-sign'
    commands:
      - swipe:
          start: 50%, 60%
          end: 50%, 25%
          duration: 600
      - waitForAnimationToEnd:
          timeout: 1200
- tapOn:
    id: 'authorization-sign'
- waitForAnimationToEnd:
    timeout: 3000
