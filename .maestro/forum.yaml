appId: com.ramassa.app
name: forum
env:
  LOCALE: ca
  CATALAN_TITLE: '{{forum:title}}'
  CATALAN_TOMBSTONE: '{{forum:deletedTombstone}}'
  CATALAN_FLAG_CONFIRMATION: '{{forum:flagConfirmation}}'
  CATALAN_PROFILE: '{{nav:tabs.profile}}'
  PUSH_DECLINE: '{{push:rationaleDecline}}'
  ARABIC_TITLE: المجتمع
  ARABIC_TOMBSTONE: تم حذف هذا المنشور.
  ARABIC_RESTART: أعِد التشغيل الآن
  ARABIC_PUSH_DECLINE: ليس الآن
---
- runFlow: _open-app.yaml
- runFlow: _sign-in.yaml
- repeat:
    times: 6
    while:
      visible: '^${PUSH_DECLINE}$'
    commands:
      - tapOn: '^${PUSH_DECLINE}$'
      - waitForAnimationToEnd:
          timeout: 3000
- runFlow:
    when:
      platform: Android
    commands:
      - tapOn: '^${CATALAN_TITLE}$'
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn:
          id: player-tab-community
- extendedWaitUntil:
    visible:
      id: forum-board
    timeout: 60000
- assertVisible: '^${CATALAN_TITLE}$'
- tapOn:
    id: forum-post-5eed0000-0000-4000-8010-000000000002
- extendedWaitUntil:
    visible:
      id: forum-detail-screen
    timeout: 30000
- tapOn:
    id: forum-flag-post
- tapOn:
    id: forum-flag-reason-privacy
- tapOn:
    id: forum-flag-comment
- inputText: rapp51-cat-private-info
- runFlow:
    when:
      platform: Android
    commands:
      - hideKeyboard
- runFlow:
    when:
      platform: iOS
    commands:
      - swipe:
          start: 50%, 45%
          end: 50%, 35%
          duration: 500
- tapOn:
    id: forum-flag-submit
- extendedWaitUntil:
    visible: '^${CATALAN_FLAG_CONFIRMATION}$'
    timeout: 30000
- tapOn: "^(D'acord|OK)$"
- repeat:
    times: 3
    while:
      notVisible:
        id: forum-board
    commands:
      - tapOn:
          id: forum-detail-back
          optional: true
      - waitForAnimationToEnd:
          timeout: 1500
- extendedWaitUntil:
    visible:
      id: forum-board
    timeout: 30000
- tapOn:
    id: forum-new-post
- extendedWaitUntil:
    visible:
      id: forum-create-screen
    timeout: 30000
- tapOn:
    id: forum-compose-category-general
- tapOn:
    id: forum-post-content
- runFlow:
    when:
      platform: Android
    commands:
      - inputText: rapp50-cat-post-inert-script
- runFlow:
    when:
      platform: iOS
    commands:
      - inputText: rapp50-cat-post català مرحبا
- runFlow:
    when:
      platform: Android
    commands:
      - hideKeyboard
- runFlow:
    when:
      platform: iOS
    commands:
      - swipe:
          start: 50%, 45%
          end: 50%, 35%
          duration: 500
- tapOn:
    id: forum-publish
- extendedWaitUntil:
    visible:
      id: forum-detail-screen
    timeout: 30000
- tapOn:
    id: forum-reply-content
- runFlow:
    when:
      platform: Android
    commands:
      - inputText: rapp50-cat-reply
- runFlow:
    when:
      platform: iOS
    commands:
      - inputText: rapp50-cat-reply resposta أهلا
- runFlow:
    when:
      platform: Android
    commands:
      - hideKeyboard
- runFlow:
    when:
      platform: iOS
    commands:
      - swipe:
          start: 50%, 45%
          end: 50%, 35%
          duration: 500
- tapOn:
    id: forum-submit-reply
- extendedWaitUntil:
    visible: '.*rapp50-cat-reply.*'
    timeout: 30000
- tapOn:
    id: forum-edit
- tapOn:
    id: forum-edit-content
- eraseText
- inputText: rapp50-cat-edited
- runFlow:
    when:
      platform: Android
    commands:
      - hideKeyboard
- runFlow:
    when:
      platform: iOS
    commands:
      - swipe:
          start: 50%, 45%
          end: 50%, 35%
          duration: 500
- tapOn:
    id: forum-save-edit
- extendedWaitUntil:
    visible: '.*rapp50-cat-edited.*'
    timeout: 30000
- tapOn:
    id: forum-delete
- tapOn:
    id: forum-confirm-delete
- extendedWaitUntil:
    visible: '^${CATALAN_TOMBSTONE}$'
    timeout: 30000
- assertVisible: '.*rapp50-cat-reply.*'

- repeat:
    times: 3
    while:
      notVisible:
        id: forum-board
    commands:
      - tapOn:
          id: forum-detail-back
          optional: true
      - waitForAnimationToEnd:
          timeout: 1500
- extendedWaitUntil:
    visible:
      id: forum-board
    timeout: 30000
- runFlow:
    when:
      platform: Android
    commands:
      - tapOn: '^${CATALAN_PROFILE}$'
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn:
          id: player-tab-profile
- repeat:
    times: 20
    while:
      notVisible:
        id: dev-menu-entry
    commands:
      - swipe:
          start: 50%, 70%
          end: 50%, 45%
          duration: 900
      - waitForAnimationToEnd:
          timeout: 2000
- assertVisible:
    id: dev-menu-entry
- runFlow:
    file: _set-language.yaml
    env:
      LOCALE: ar
- waitForAnimationToEnd:
    timeout: 12000
- repeat:
    times: 3
    while:
      notVisible:
        id: forum-board
    commands:
      - tapOn:
          id: player-tab-community
          optional: true
      - tapOn:
          text: '^${ARABIC_TITLE}$'
          optional: true
      - waitForAnimationToEnd:
          timeout: 3000
- extendedWaitUntil:
    visible:
      id: forum-board
    timeout: 60000
- assertVisible: '^${ARABIC_TITLE}$'
- tapOn:
    id: forum-new-post
- extendedWaitUntil:
    visible:
      id: forum-create-screen
    timeout: 30000
- tapOn:
    id: forum-compose-category-general
- tapOn:
    id: forum-post-content
- runFlow:
    when:
      platform: Android
    commands:
      - inputText: rapp50-ar-post
- runFlow:
    when:
      platform: iOS
    commands:
      - inputText: rapp50-ar-post مرحبا Ramassà
- runFlow:
    when:
      platform: Android
    commands:
      - hideKeyboard
- runFlow:
    when:
      platform: iOS
    commands:
      - swipe:
          start: 50%, 45%
          end: 50%, 35%
          duration: 500
- tapOn:
    id: forum-publish
- extendedWaitUntil:
    visible:
      id: forum-detail-screen
    timeout: 30000
- tapOn:
    id: forum-reply-content
- runFlow:
    when:
      platform: Android
    commands:
      - inputText: rapp50-ar-reply
- runFlow:
    when:
      platform: iOS
    commands:
      - inputText: rapp50-ar-reply رد resposta
- runFlow:
    when:
      platform: Android
    commands:
      - hideKeyboard
- runFlow:
    when:
      platform: iOS
    commands:
      - swipe:
          start: 50%, 45%
          end: 50%, 35%
          duration: 500
- tapOn:
    id: forum-submit-reply
- extendedWaitUntil:
    visible: '.*rapp50-ar-reply.*'
    timeout: 30000
- tapOn:
    id: forum-edit
- tapOn:
    id: forum-edit-content
- eraseText
- inputText: rapp50-ar-edited
- runFlow:
    when:
      platform: Android
    commands:
      - hideKeyboard
- runFlow:
    when:
      platform: iOS
    commands:
      - swipe:
          start: 50%, 45%
          end: 50%, 35%
          duration: 500
- tapOn:
    id: forum-save-edit
- extendedWaitUntil:
    visible: '.*rapp50-ar-edited.*'
    timeout: 30000
- tapOn:
    id: forum-delete
- tapOn:
    id: forum-confirm-delete
- extendedWaitUntil:
    visible: '^${ARABIC_TOMBSTONE}$'
    timeout: 30000
- assertVisible: '.*rapp50-ar-reply.*'
