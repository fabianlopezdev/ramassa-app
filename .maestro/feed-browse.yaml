appId: com.ramassa.app
name: feed-browse
# The feed contract in both grant languages: pinned urgent content, category
# chips, and the detail transition. Arabic is verified after a real relaunch.
env:
  DEV_CLIENT_URL: ramassa://expo-development-client/?url=http%3A%2F%2Flocalhost%3A8081
  LOCALE: ca
  LOCALE_AR: ar
  HOME_TITLE_CA: '{{home:feedTitle}}'
  DETAIL_TITLE_CA: '{{home:detailTitle}}'
  PINNED_CA: '{{home:pinned}}'
  FILTER_URGENT_CA: '{{home:category.urgent}}'
  FILTER_SOCIAL_CA: '{{home:category.social}}'
  TAB_PROFILE_CA: '{{nav:tabs.profile}}'
  PROFILE_CA_TITLE: '{{profile:title}}'
  HOME_TITLE_AR: 'الإعلانات'
  DETAIL_TITLE_AR: 'إعلان'
  PINNED_AR: 'مثبّت'
  FILTER_URGENT_AR: 'عاجل'
  FILTER_SOCIAL_AR: 'اجتماعي'
  TAB_HOME_AR: 'الرئيسية'
  PUSH_DECLINE_AR: 'ليس الآن'
---
- runFlow:
    file: _open-app.yaml
    env:
      LOCALE: ca
- runFlow: _sign-in.yaml
- runFlow: _relaunch.yaml
- extendedWaitUntil:
    visible: '.*${HOME_TITLE_CA}.*'
    timeout: 120000

# Catalan: the urgent chip exposes its selected state; the pinned marker is in
# the first seeded urgent card, and tapping it must reach the detail heading.
- tapOn: '^${FILTER_URGENT_CA}$'
- assertVisible:
    text: '^${FILTER_URGENT_CA}$'
    selected: true
- assertVisible: '.*${PINNED_CA}.*'
- tapOn: '.*${PINNED_CA}.*'
- extendedWaitUntil:
    visible: '.*${DETAIL_TITLE_CA}.*'
    timeout: 30000
- back
- repeat:
    times: 8
    commands:
      - swipe:
          start: 50%, 22%
          end: 50%, 82%
          duration: 700
      - waitForAnimationToEnd:
          timeout: 900
- tapOn: '^${FILTER_SOCIAL_CA}$'
- assertVisible:
    text: '^${FILTER_SOCIAL_CA}$'
    selected: true

# Reach Profile by its arrival heading, then switch the app to Arabic through
# the same accessibility-visible dev control used by the i18n regression.
- repeat:
    times: 6
    while:
      notVisible: '.*${PROFILE_CA_TITLE}.*'
    commands:
      - tapOn:
          text: '^${TAB_PROFILE_CA}$'
          optional: true
      - waitForAnimationToEnd:
          timeout: 2500
- extendedWaitUntil:
    visible: '.*${PROFILE_CA_TITLE}.*'
    timeout: 30000
- repeat:
    times: 20
    while:
      notVisible: '.*Developer menu.*'
    commands:
      - swipe:
          start: 50%, 72%
          end: 50%, 48%
          duration: 900
      - waitForAnimationToEnd:
          timeout: 1200
- runFlow:
    file: _set-language.yaml
    env:
      LOCALE: ar
- stopApp
- openLink: ${DEV_CLIENT_URL}
- tapOn:
    text: '^Open$'
    optional: true
- waitForAnimationToEnd:
    timeout: 12000
- repeat:
    times: 6
    while:
      visible: '.*Close.*'
    commands:
      - tapOn:
          text: '.*Close.*'
          optional: true
      - waitForAnimationToEnd:
          timeout: 2000
- tapOn:
    text: '^${PUSH_DECLINE_AR}$'
    optional: true
- repeat:
    times: 6
    while:
      notVisible: '.*${HOME_TITLE_AR}.*'
    commands:
      - tapOn:
          text: '^${TAB_HOME_AR}$'
          optional: true
      - waitForAnimationToEnd:
          timeout: 2500
- extendedWaitUntil:
    visible: '.*${HOME_TITLE_AR}.*'
    timeout: 120000

- tapOn: '^${FILTER_URGENT_AR}$'
- assertVisible:
    text: '^${FILTER_URGENT_AR}$'
    selected: true
- assertVisible: '.*${PINNED_AR}.*'
- tapOn: '.*${PINNED_AR}.*'
- extendedWaitUntil:
    visible: '.*${DETAIL_TITLE_AR}.*'
    timeout: 30000
- back
- repeat:
    times: 8
    commands:
      - swipe:
          start: 50%, 22%
          end: 50%, 82%
          duration: 700
      - waitForAnimationToEnd:
          timeout: 900
- tapOn: '^${FILTER_SOCIAL_AR}$'
- assertVisible:
    text: '^${FILTER_SOCIAL_AR}$'
    selected: true
