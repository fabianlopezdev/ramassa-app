appId: com.ramassa.app
name: feed-browse
# The feed contract in both grant languages: pinned urgent content, category
# chips, and the detail transition. Arabic is verified after a real relaunch.
env:
  DEV_CLIENT_URL: ramassa://expo-development-client/?url=http%3A%2F%2Flocalhost%3A8081
  BACK: '{{common:back}}'
  TAB_HOME: '{{nav:tabs.home}}'
  PUSH_DECLINE: '{{push:rationaleDecline}}'
  LOCALE: ca
  HOME_TITLE_CA: '{{home:feedTitle}}'
  PINNED_CA: '{{home:pinned}}'
  FILTER_URGENT_CA: '{{home:category.urgent}}'
  FILTER_SOCIAL_CA: '{{home:category.social}}'
  TAB_PROFILE_CA: '{{nav:tabs.profile}}'
  PROFILE_CA_TITLE: '{{profile:title}}'
  LANGUAGE_AR: 'العربية'
  RESTART_AR: 'أعِد التشغيل الآن'
  HOME_TITLE_AR: 'الإعلانات'
  PINNED_AR: 'مثبّت'
  FILTER_URGENT_AR: 'عاجل'
  FILTER_SOCIAL_AR: 'اجتماعي'
---
- runFlow:
    file: _open-app.yaml
    env:
      LOCALE: ca
- runFlow: _sign-in.yaml
- runFlow: _relaunch.yaml
- extendedWaitUntil:
    visible: '.*${HOME_TITLE_CA}.*'
    timeout: 120000

# Catalan: the urgent chip exposes its selected state; the pinned marker is in
# the first seeded urgent card, and tapping it must reach the detail heading.
- tapOn: '^${FILTER_URGENT_CA}$'
- assertVisible:
    text: '^${FILTER_URGENT_CA}$'
    selected: true
- assertVisible: '.*${PINNED_CA}.*'
- tapOn: '.*${PINNED_CA}.*'
- extendedWaitUntil:
    visible:
      id: announcement-detail-screen
    timeout: 30000
- tapOn:
    id: announcement-detail-back
    # The Android dev-menu gear overlaps this mirrored button's centre in RTL.
    point: 20%, 50%
- repeat:
    times: 8
    commands:
      - swipe:
          start: 50%, 22%
          end: 50%, 82%
          duration: 700
      - waitForAnimationToEnd:
          timeout: 900
- tapOn: '^${FILTER_SOCIAL_CA}$'
- assertVisible:
    text: '^${FILTER_SOCIAL_CA}$'
    selected: true

# Reach Profile by its arrival heading, then switch through the player-facing
# language control and accept its required native direction restart.
- repeat:
    times: 6
    while:
      notVisible: '.*${PROFILE_CA_TITLE}.*'
    commands:
      - tapOn:
          text: '^${TAB_PROFILE_CA}$'
          optional: true
      - waitForAnimationToEnd:
          timeout: 2500
- extendedWaitUntil:
    visible: '.*${PROFILE_CA_TITLE}.*'
    timeout: 30000
- repeat:
    times: 20
    while:
      notVisible: '^${LANGUAGE_AR}$'
    commands:
      - swipe:
          start: 50%, 72%
          end: 50%, 48%
          duration: 900
      - waitForAnimationToEnd:
          timeout: 1200
- swipe:
    start: 50%, 65%
    end: 50%, 55%
    duration: 900
- waitForAnimationToEnd:
    timeout: 2000
- tapOn: '^${LANGUAGE_AR}$'
- waitForAnimationToEnd:
    timeout: 2500
# The Arabic restart action is language evidence from the app content itself.
# Native iOS tab labels carry bidi metadata that makes an exact Maestro text
# regex fail even while the correct Arabic label is visibly rendered.
- repeat:
    times: 12
    while:
      notVisible: '^${RESTART_AR}$'
    commands:
      - swipe:
          start: 50%, 70%
          end: 50%, 35%
          duration: 900
      - waitForAnimationToEnd:
          timeout: 1200
- extendedWaitUntil:
    visible: '^${RESTART_AR}$'
    timeout: 30000
- tapOn: '^${RESTART_AR}$'
- waitForAnimationToEnd:
    timeout: 12000
- runFlow:
    file: _relaunch.yaml
    env:
      TAB_HOME: 'الرئيسية'
      PUSH_DECLINE: 'ليس الآن'
      BACK: 'رجوع'
- extendedWaitUntil:
    visible: '.*${HOME_TITLE_AR}.*'
    timeout: 120000

- tapOn: '^${FILTER_URGENT_AR}$'
- assertVisible:
    text: '^${FILTER_URGENT_AR}$'
    selected: true
- assertVisible: '.*${PINNED_AR}.*'
- tapOn: '.*${PINNED_AR}.*'
- extendedWaitUntil:
    visible:
      id: announcement-detail-screen
    timeout: 30000
- tapOn:
    id: announcement-detail-back
    point: 20%, 50%
- repeat:
    times: 8
    commands:
      - swipe:
          start: 50%, 22%
          end: 50%, 82%
          duration: 700
      - waitForAnimationToEnd:
          timeout: 900
- tapOn: '^${FILTER_SOCIAL_AR}$'
- assertVisible:
    text: '^${FILTER_SOCIAL_AR}$'
    selected: true
