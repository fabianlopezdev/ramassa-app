appId: com.ramassa.app
name: smoke-onboarding-invited
# The wizard for a woman staff invited with part of her record filled in
# (RAPP-300), driven to completion.
#
# The seed gives her name, date of birth, nationality, referring entity and
# clothing size as staff answers. So the wizard must open on the background
# screen with only place of birth left (her language is the app's since
# RAPP-553), skip the entity on the logistics screen, and show what staff
# entered on the summary. Staff also set two choices (RAPP-301): she reviews
# the clothing size on the equipment screen, which opens on the staff answer
# M, and she is not asked her phone. Steps are numbered from 1, because the
# step count shows only what she sees; after logistics the flow follows the
# screens by their content, so a staff screen added later does not break it.
#
# iOS lists a button below the fold in the accessibility tree, so a tap can
# report success and press nothing. Each "until the next step" loop therefore
# also scrolls, as in `smoke-onboarding`.
#
# Like `smoke-onboarding`, finishing spends the account: a second run needs a
# `bun run db:reset` first, which `bun run qa:smoke` does before each platform.
env:
  CUSTOM_SCREEN_TITLE: Com arribes als entrenaments
  # The seeded field placed on that screen, worded as its placement says (RAPP-655).
  CUSTOM_FIELD_LABEL: Vens amb transport públic
  DEV_MENU_LABEL: Developer menu
  DEV_MENU_LINK: ramassa://dev-menu
  INVITED_EMAIL: '{{invited:email}}'
  CONTINUE: '{{onboarding:continueAction}}'
  FINISH: '{{onboarding:finishAction}}'
  SUMMARY_CONFIRM: '{{onboarding:summaryConfirmAction}}'
  DOC_NONE: '{{onboarding:documentTypeNone}}'
  NO_OPTION: '{{onboarding:noOption}}'
  TERMS_ACCEPT: '{{onboarding:termsAcceptLabel}}'
  TERMS_READ_FULL: '{{onboarding:termsReadFullAction}}'
  PUSH_DECLINE: '{{push:rationaleDecline}}'
  HOME_FEED_TITLE: '{{home:feedTitle}}'
  TAB_HOME: '{{nav:tabs.home}}'
  # Data, not copy: the shoe size chips show the catalogue value.
  SHOE_SIZE: '38'
  CLOTHING_SIZE: M
---
- runFlow: _open-app.yaml

# Sign in through the developer menu, as `smoke-onboarding` does: the shared
# sign-in fragment waits on the home title, which this woman must not reach yet.
# Signed in through the menu's account link (RAPP-500): one link opens the
# menu and signs in as this seeded account with the same password sign-in the
# account rows use. Scrolling the roster to the row cost about a minute.
- repeat:
    times: 6
    while:
      notVisible: '.*signed in as ${INVITED_EMAIL}.*'
    commands:
      - openLink: ${DEV_MENU_LINK}?account=${INVITED_EMAIL}
      - tapOn:
          text: '^Open$'
          optional: true
      - waitForAnimationToEnd:
          timeout: 3000
      - extendedWaitUntil:
          visible: '.*signed in as ${INVITED_EMAIL}.*'
          timeout: 10000
          optional: true
- extendedWaitUntil:
    visible: '.*signed in as ${INVITED_EMAIL}.*'
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 3000

- repeat:
    times: 6
    while:
      notVisible:
        id: 'wizard-step-1'
    commands:
      - tapOn:
          text: '^${PUSH_DECLINE}$'
          optional: true
      - tapOn:
          text: '.*Close.*'
          optional: true
      - waitForAnimationToEnd:
          timeout: 3000
- extendedWaitUntil:
    visible:
      id: 'wizard-step-1'
    timeout: 120000
- waitForAnimationToEnd:
    timeout: 3000

# ── Step 1: background, only the gaps ────────────────────────────────────────
# Staff gave her names and date of birth, so the name screen is skipped and
# the date fields are not asked. Checked after the place-of-birth field is
# PRESENT, so the absence checks cannot pass on a screen still painting.
- extendedWaitUntil:
    visible:
      id: 'onboarding-place-of-birth'
    timeout: 20000
- assertNotVisible:
    id: 'onboarding-first-name'
- assertNotVisible:
    id: 'onboarding-day'
- tapOn:
    id: 'onboarding-place-of-birth'
- inputText: 'Bamako'
- swipe:
    start: 50%, 45%
    end: 50%, 25%
    duration: 600
- waitForAnimationToEnd:
    timeout: 1500
- repeat:
    times: 12
    while:
      notVisible: '^${CONTINUE}$'
    commands:
      - swipe:
          start: 50%, 45%
          end: 50%, 15%
          duration: 600
      - waitForAnimationToEnd:
          timeout: 1500
- repeat:
    times: 8
    while:
      notVisible:
        id: 'wizard-step-2'
    commands:
      - tapOn:
          text: '^${CONTINUE}$'
          optional: true
      - waitForAnimationToEnd:
          timeout: 2000
      # Only while the step has not changed yet: on Android the next step
      # opens within the wait, and a swipe would scroll it (RAPP-530).
      - runFlow:
          when:
            notVisible:
              id: 'wizard-step-2'
          commands:
            - swipe:
                start: 50%, 45%
                end: 50%, 20%
                duration: 600
            - waitForAnimationToEnd:
                timeout: 1200
- extendedWaitUntil:
    visible:
      id: 'wizard-step-2'
    timeout: 20000

# ── Step 2: documentation ──────────────────────────────────────────────────────
- repeat:
    times: 8
    while:
      notVisible: '^${DOC_NONE}$'
    commands:
      - swipe:
          start: 50%, 45%
          end: 50%, 20%
          duration: 600
      - waitForAnimationToEnd:
          timeout: 1200
- repeat:
    times: 4
    while:
      notVisible:
        text: '^${DOC_NONE}$'
        selected: true
    commands:
      - tapOn:
          text: '^${DOC_NONE}$'
          optional: true
      - waitForAnimationToEnd:
          timeout: 2000
- assertVisible:
    text: '^${DOC_NONE}$'
    selected: true
- repeat:
    times: 12
    while:
      notVisible: '^${CONTINUE}$'
    commands:
      - swipe:
          start: 50%, 45%
          end: 50%, 15%
          duration: 600
      - waitForAnimationToEnd:
          timeout: 1500
- repeat:
    times: 8
    while:
      notVisible:
        id: 'wizard-step-3'
    commands:
      - tapOn:
          text: '^${CONTINUE}$'
          optional: true
      - waitForAnimationToEnd:
          timeout: 2000
      # Only while the step has not changed yet: on Android the next step
      # opens within the wait, and a swipe would scroll it (RAPP-530).
      - runFlow:
          when:
            notVisible:
              id: 'wizard-step-3'
          commands:
            - swipe:
                start: 50%, 45%
                end: 50%, 20%
                duration: 600
            - waitForAnimationToEnd:
                timeout: 1200
- extendedWaitUntil:
    visible:
      id: 'wizard-step-3'
    timeout: 20000

# ── Step 3: logistics, without the entity question (staff gave it) ─────────
- repeat:
    times: 10
    while:
      notVisible:
        id: 'question-dependents'
    commands:
      - swipe:
          start: 50%, 45%
          end: 50%, 20%
          duration: 600
      - waitForAnimationToEnd:
          timeout: 1200
- assertNotVisible:
    id: 'question-reference_entity'
- repeat:
    times: 4
    while:
      notVisible:
        text: '^${NO_OPTION}$'
        checked: true
    commands:
      - tapOn:
          text: '^${NO_OPTION}$'
      - waitForAnimationToEnd:
          timeout: 2000
- assertVisible:
    text: '^${NO_OPTION}$'
    checked: true

# ── Step 4: equipment, with the clothing size to review ────────────────────
- repeat:
    times: 10
    while:
      notVisible:
        id: 'question-clothing_size'
    commands:
      - tapOn:
          text: '^${CONTINUE}$'
          optional: true
      - waitForAnimationToEnd:
          timeout: 2000
      # Only while the step has not changed yet: on Android the next step
      # opens within the wait, and a swipe would scroll it (RAPP-530).
      - runFlow:
          when:
            notVisible:
              id: 'question-clothing_size'
          commands:
            - swipe:
                start: 50%, 45%
                end: 50%, 20%
                duration: 600
            - waitForAnimationToEnd:
                timeout: 1200
# Ask (RAPP-301): the clothing size is asked, filled with the staff answer.
- repeat:
    times: 10
    while:
      notVisible: '^${CLOTHING_SIZE}$'
    commands:
      - swipe:
          start: 50%, 45%
          end: 50%, 20%
          duration: 600
      - waitForAnimationToEnd:
          timeout: 1200
- assertVisible:
    text: '^${CLOTHING_SIZE}$'
    selected: true
- swipe:
    start: 50%, 45%
    end: 50%, 20%
    duration: 600
- waitForAnimationToEnd:
    timeout: 1200
- repeat:
    times: 10
    while:
      notVisible: '^${SHOE_SIZE}$'
    commands:
      - swipe:
          start: 50%, 45%
          end: 50%, 20%
          duration: 600
      - waitForAnimationToEnd:
          timeout: 1200
- repeat:
    times: 4
    while:
      notVisible:
        text: '^${SHOE_SIZE}$'
        selected: true
    commands:
      - tapOn:
          text: '^${SHOE_SIZE}$'
          optional: true
      - waitForAnimationToEnd:
          timeout: 2000
- assertVisible:
    text: '^${SHOE_SIZE}$'
    selected: true

# ── The staff screen seeded after logistics (RAPP-307) ─────────────────────
- repeat:
    times: 10
    while:
      notVisible:
        text: '.*${CUSTOM_SCREEN_TITLE}.*'
    commands:
      - tapOn:
          text: '^${CONTINUE}$'
          optional: true
      - waitForAnimationToEnd:
          timeout: 2000
      # Only while the step has not changed yet: on Android the next step
      # opens within the wait, and a swipe would scroll it (RAPP-530).
      - runFlow:
          when:
            notVisible:
              text: '.*${CUSTOM_SCREEN_TITLE}.*'
          commands:
            - swipe:
                start: 50%, 45%
                end: 50%, 20%
                duration: 600
            - waitForAnimationToEnd:
                timeout: 1200
# Its field comes from the screen's placements, with the field's own name
# where the placement has no wording of its own (RAPP-655).
- assertVisible:
    text: '.*${CUSTOM_SCREEN_TITLE}.*'
- assertVisible:
    id: 'custom-question-5eed0000-0000-4000-8045-000000000001'
- assertVisible:
    text: '.*${CUSTOM_FIELD_LABEL}.*'
- tapOn:
    id: 'custom-question-5eed0000-0000-4000-8045-000000000001-yes'
- waitForAnimationToEnd:
    timeout: 1500

# ── The other staff screens and the registration questions (RAPP-306) ─────
# All optional, left empty. Continue until the summary names her.
- repeat:
    times: 24
    while:
      notVisible:
        text: '.*Mariam.*'
    commands:
      - tapOn:
          text: '^${CONTINUE}$'
          optional: true
      - waitForAnimationToEnd:
          timeout: 2000
      # Only while the step has not changed yet: on Android the next step
      # opens within the wait, and a swipe would scroll it (RAPP-530).
      - runFlow:
          when:
            notVisible:
              text: '.*Mariam.*'
          commands:
            - swipe:
                start: 50%, 45%
                end: 50%, 20%
                duration: 600
            - waitForAnimationToEnd:
                timeout: 1200

# ── The summary ────────────────────────────────────────────────────────────
# What staff entered is on it, next to what she just answered.
- assertVisible: '.*Mariam.*'
- repeat:
    times: 12
    while:
      notVisible: '.*Creu Roja Osona.*'
    commands:
      - swipe:
          start: 50%, 45%
          end: 50%, 20%
          duration: 600
      - waitForAnimationToEnd:
          timeout: 1200
- assertVisible: '.*Creu Roja Osona.*'
- repeat:
    times: 12
    while:
      notVisible: '^${SUMMARY_CONFIRM}$'
    commands:
      - swipe:
          start: 50%, 45%
          end: 50%, 15%
          duration: 600
      - waitForAnimationToEnd:
          timeout: 1500
# Confirming opens the note before the terms, which opens the terms themselves.
- repeat:
    times: 8
    while:
      notVisible: '^${TERMS_READ_FULL}$'
    commands:
      - tapOn:
          text: '^${SUMMARY_CONFIRM}$'
          optional: true
      - waitForAnimationToEnd:
          timeout: 2000
      - runFlow:
          when:
            notVisible: '^${TERMS_READ_FULL}$'
          commands:
            - swipe:
                start: 50%, 45%
                end: 50%, 20%
                duration: 600
            - waitForAnimationToEnd:
                timeout: 1200
- tapOn:
    text: '^${TERMS_READ_FULL}$'
- waitForAnimationToEnd:
    timeout: 3000

# ── The terms ──────────────────────────────────────────────────────────────
- repeat:
    times: 10
    while:
      notVisible: '^${TERMS_ACCEPT}$'
    commands:
      - swipe:
          start: 50%, 45%
          end: 50%, 20%
          duration: 600
      - waitForAnimationToEnd:
          timeout: 1200
- repeat:
    times: 4
    while:
      notVisible:
        id: 'terms-acceptance'
        selected: true
    commands:
      - tapOn:
          id: 'terms-acceptance'
          optional: true
      - waitForAnimationToEnd:
          timeout: 2000
- assertVisible:
    id: 'terms-acceptance'
    selected: true
- runFlow: _sign-app-terms.yaml
- repeat:
    times: 12
    while:
      notVisible: '^${FINISH}$'
    commands:
      - swipe:
          start: 50%, 45%
          end: 50%, 15%
          duration: 600
      - waitForAnimationToEnd:
          timeout: 1500
# Finishing makes her a player, and a player signs the season authorization
# before the tabs (RAPP-304).
- repeat:
    times: 8
    while:
      notVisible:
        id: 'authorization-screen'
    commands:
      - tapOn:
          text: '^${FINISH}$'
          optional: true
      - waitForAnimationToEnd:
          timeout: 3000
- runFlow: _sign-authorization.yaml
- repeat:
    times: 8
    while:
      notVisible: '.*${HOME_FEED_TITLE}.*'
    commands:
      - tapOn:
          text: '^${FINISH}$'
          optional: true
      - waitForAnimationToEnd:
          timeout: 3000
      - tapOn:
          text: '^${PUSH_DECLINE}$'
          optional: true
      - waitForAnimationToEnd:
          timeout: 2000

# She is a player now and inside the app.
- extendedWaitUntil:
    visible: '.*${HOME_FEED_TITLE}.*'
    timeout: 120000
# The notification prompt waits until she has signed (RAPP-304), so it can
# open over the home screen just now. Decline it before checking the tabs.
- waitForAnimationToEnd:
    timeout: 3000
- tapOn:
    text: '^${PUSH_DECLINE}$'
    optional: true
- waitForAnimationToEnd:
    timeout: 2000
- assertVisible:
    text: '^${TAB_HOME}$'
- assertNotVisible:
    id: 'terms-acceptance'
