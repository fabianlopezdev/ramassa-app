appId: com.ramassa.app
name: smoke-onboarding-invited
# The wizard for a woman staff invited with part of her record filled in
# (RAPP-300), driven to completion.
#
# The seed gives her name, date of birth, nationality, referring entity and
# clothing size as staff answers. So the wizard must open on the background
# screen with only place of birth and language left, skip the entity on the
# logistics screen, and show what staff entered on the summary. Staff also set
# two choices (RAPP-301): she reviews the clothing size, which opens on the
# staff answer M, and she is not asked her phone. Five screens in all,
# numbered from 1, because the step count shows only what she sees.
#
# iOS lists a button below the fold in the accessibility tree, so a tap can
# report success and press nothing. Each "until the next step" loop therefore
# also scrolls, as in `smoke-onboarding`.
#
# Like `smoke-onboarding`, finishing spends the account: a second run needs a
# `bun run db:reset` first, which `bun run qa:smoke` does before each platform.
env:
  DEV_MENU_LABEL: Developer menu
  DEV_MENU_LINK: ramassa://dev-menu
  ACCOUNTS_SECTION: Accounts and roles
  INVITED_EMAIL: '{{invited:email}}'
  CONTINUE: '{{onboarding:continueAction}}'
  FINISH: '{{onboarding:finishAction}}'
  SUMMARY_CONFIRM: '{{onboarding:summaryConfirmAction}}'
  DOC_NONE: '{{onboarding:documentTypeNone}}'
  NO_OPTION: '{{onboarding:noOption}}'
  TERMS_ACCEPT: '{{onboarding:termsAcceptLabel}}'
  PUSH_DECLINE: '{{push:rationaleDecline}}'
  HOME_FEED_TITLE: '{{home:feedTitle}}'
  TAB_HOME: '{{nav:tabs.home}}'
  # Data, not copy: the language chip shows the native name in every locale,
  # and the shoe size chips show the catalogue value.
  LANGUAGE_CHIP: Català
  SHOE_SIZE: '38'
  CLOTHING_SIZE: M
---
- runFlow: _open-app.yaml

# Sign in through the developer menu, as `smoke-onboarding` does: the shared
# sign-in fragment waits on the home title, which this woman must not reach yet.
- repeat:
    times: 6
    while:
      notVisible: '.*${ACCOUNTS_SECTION}.*'
    commands:
      - tapOn:
          text: '.*Close.*'
          optional: true
      - openLink: ${DEV_MENU_LINK}
      - waitForAnimationToEnd:
          timeout: 3000
- extendedWaitUntil:
    visible: '.*${ACCOUNTS_SECTION}.*'
    timeout: 15000
- waitForAnimationToEnd:
    timeout: 5000
- repeat:
    times: 20
    while:
      notVisible: '.*${INVITED_EMAIL}.*'
    commands:
      - swipe:
          start: 50%, 70%
          end: 50%, 50%
          duration: 900
      - waitForAnimationToEnd:
          timeout: 2500
- swipe:
    start: 50%, 65%
    end: 50%, 55%
    duration: 900
- waitForAnimationToEnd:
    timeout: 2500
- tapOn: '.*${INVITED_EMAIL}.*'
- waitForAnimationToEnd:
    timeout: 3000

- repeat:
    times: 6
    while:
      notVisible:
        id: 'wizard-step-1'
    commands:
      - tapOn:
          text: '^${PUSH_DECLINE}$'
          optional: true
      - tapOn:
          text: '.*Close.*'
          optional: true
      - waitForAnimationToEnd:
          timeout: 3000
- extendedWaitUntil:
    visible:
      id: 'wizard-step-1'
    timeout: 120000
- waitForAnimationToEnd:
    timeout: 3000

# ── Step 1: background, only the gaps ────────────────────────────────────────
# Staff gave her names and date of birth, so the name screen is skipped and
# the date fields are not asked. Checked after the place-of-birth field is
# PRESENT, so the absence checks cannot pass on a screen still painting.
- extendedWaitUntil:
    visible:
      id: 'onboarding-place-of-birth'
    timeout: 20000
- assertNotVisible:
    id: 'onboarding-first-name'
- assertNotVisible:
    id: 'onboarding-day'
- tapOn:
    id: 'onboarding-place-of-birth'
- inputText: 'Bamako'
- swipe:
    start: 50%, 45%
    end: 50%, 25%
    duration: 600
- waitForAnimationToEnd:
    timeout: 1500
- repeat:
    times: 10
    while:
      notVisible: '^${LANGUAGE_CHIP}$'
    commands:
      - swipe:
          start: 50%, 45%
          end: 50%, 20%
          duration: 600
      - waitForAnimationToEnd:
          timeout: 1200
- repeat:
    times: 4
    while:
      notVisible:
        text: '^${LANGUAGE_CHIP}$'
        selected: true
    commands:
      - tapOn:
          text: '^${LANGUAGE_CHIP}$'
          optional: true
      - waitForAnimationToEnd:
          timeout: 2000
- assertVisible:
    text: '^${LANGUAGE_CHIP}$'
    selected: true
- repeat:
    times: 12
    while:
      notVisible: '^${CONTINUE}$'
    commands:
      - swipe:
          start: 50%, 45%
          end: 50%, 15%
          duration: 600
      - waitForAnimationToEnd:
          timeout: 1500
- repeat:
    times: 8
    while:
      notVisible:
        id: 'wizard-step-2'
    commands:
      - tapOn:
          text: '^${CONTINUE}$'
          optional: true
      - waitForAnimationToEnd:
          timeout: 2000
      - swipe:
          start: 50%, 45%
          end: 50%, 20%
          duration: 600
      - waitForAnimationToEnd:
          timeout: 1200
- extendedWaitUntil:
    visible:
      id: 'wizard-step-2'
    timeout: 20000

# ── Step 2: documentation ──────────────────────────────────────────────────────
- repeat:
    times: 8
    while:
      notVisible: '^${DOC_NONE}$'
    commands:
      - swipe:
          start: 50%, 45%
          end: 50%, 20%
          duration: 600
      - waitForAnimationToEnd:
          timeout: 1200
- repeat:
    times: 4
    while:
      notVisible:
        text: '^${DOC_NONE}$'
        selected: true
    commands:
      - tapOn:
          text: '^${DOC_NONE}$'
          optional: true
      - waitForAnimationToEnd:
          timeout: 2000
- assertVisible:
    text: '^${DOC_NONE}$'
    selected: true
- repeat:
    times: 12
    while:
      notVisible: '^${CONTINUE}$'
    commands:
      - swipe:
          start: 50%, 45%
          end: 50%, 15%
          duration: 600
      - waitForAnimationToEnd:
          timeout: 1500
- repeat:
    times: 8
    while:
      notVisible:
        id: 'wizard-step-3'
    commands:
      - tapOn:
          text: '^${CONTINUE}$'
          optional: true
      - waitForAnimationToEnd:
          timeout: 2000
      - swipe:
          start: 50%, 45%
          end: 50%, 20%
          duration: 600
      - waitForAnimationToEnd:
          timeout: 1200
- extendedWaitUntil:
    visible:
      id: 'wizard-step-3'
    timeout: 20000

# ── Step 3: logistics, without the entity, with the clothing size to review ─
- repeat:
    times: 10
    while:
      notVisible: '^${NO_OPTION}$'
    commands:
      - swipe:
          start: 50%, 45%
          end: 50%, 20%
          duration: 600
      - waitForAnimationToEnd:
          timeout: 1200
- repeat:
    times: 4
    while:
      notVisible:
        text: '^${NO_OPTION}$'
        selected: true
    commands:
      - tapOn:
          text: '^${NO_OPTION}$'
          optional: true
      - waitForAnimationToEnd:
          timeout: 2000
- assertVisible:
    text: '^${NO_OPTION}$'
    selected: true
# Ask (RAPP-301): the clothing size is asked, filled with the staff answer.
- repeat:
    times: 10
    while:
      notVisible: '^${CLOTHING_SIZE}$'
    commands:
      - swipe:
          start: 50%, 45%
          end: 50%, 20%
          duration: 600
      - waitForAnimationToEnd:
          timeout: 1200
- assertVisible:
    text: '^${CLOTHING_SIZE}$'
    selected: true
- swipe:
    start: 50%, 45%
    end: 50%, 20%
    duration: 600
- waitForAnimationToEnd:
    timeout: 1200
- repeat:
    times: 10
    while:
      notVisible: '^${SHOE_SIZE}$'
    commands:
      - swipe:
          start: 50%, 45%
          end: 50%, 20%
          duration: 600
      - waitForAnimationToEnd:
          timeout: 1200
- repeat:
    times: 4
    while:
      notVisible:
        text: '^${SHOE_SIZE}$'
        selected: true
    commands:
      - tapOn:
          text: '^${SHOE_SIZE}$'
          optional: true
      - waitForAnimationToEnd:
          timeout: 2000
- assertVisible:
    text: '^${SHOE_SIZE}$'
    selected: true
- repeat:
    times: 12
    while:
      notVisible: '^${CONTINUE}$'
    commands:
      - swipe:
          start: 50%, 45%
          end: 50%, 15%
          duration: 600
      - waitForAnimationToEnd:
          timeout: 1500
- repeat:
    times: 8
    while:
      notVisible:
        id: 'wizard-step-4'
    commands:
      - tapOn:
          text: '^${CONTINUE}$'
          optional: true
      - waitForAnimationToEnd:
          timeout: 2000
      - swipe:
          start: 50%, 45%
          end: 50%, 20%
          duration: 600
      - waitForAnimationToEnd:
          timeout: 1200
- extendedWaitUntil:
    visible:
      id: 'wizard-step-4'
    timeout: 20000

# ── Step 4: summary ────────────────────────────────────────────────────────────
# What staff entered is on it, next to what she just answered.
- assertVisible: '.*Mariam.*'
- repeat:
    times: 12
    while:
      notVisible: '.*Creu Roja Osona.*'
    commands:
      - swipe:
          start: 50%, 45%
          end: 50%, 20%
          duration: 600
      - waitForAnimationToEnd:
          timeout: 1200
- assertVisible: '.*Creu Roja Osona.*'
- repeat:
    times: 12
    while:
      notVisible: '^${SUMMARY_CONFIRM}$'
    commands:
      - swipe:
          start: 50%, 45%
          end: 50%, 15%
          duration: 600
      - waitForAnimationToEnd:
          timeout: 1500
- repeat:
    times: 8
    while:
      notVisible:
        id: 'wizard-step-5'
    commands:
      - tapOn:
          text: '^${SUMMARY_CONFIRM}$'
          optional: true
      - waitForAnimationToEnd:
          timeout: 2000
      - swipe:
          start: 50%, 45%
          end: 50%, 20%
          duration: 600
      - waitForAnimationToEnd:
          timeout: 1200
- extendedWaitUntil:
    visible:
      id: 'wizard-step-5'
    timeout: 20000

# ── Step 5: terms ──────────────────────────────────────────────────────────────
- repeat:
    times: 10
    while:
      notVisible: '^${TERMS_ACCEPT}$'
    commands:
      - swipe:
          start: 50%, 45%
          end: 50%, 20%
          duration: 600
      - waitForAnimationToEnd:
          timeout: 1200
- repeat:
    times: 4
    while:
      notVisible:
        text: '^${TERMS_ACCEPT}$'
        selected: true
    commands:
      - tapOn:
          text: '^${TERMS_ACCEPT}$'
          optional: true
      - waitForAnimationToEnd:
          timeout: 2000
- assertVisible:
    text: '^${TERMS_ACCEPT}$'
    selected: true
- repeat:
    times: 12
    while:
      notVisible: '^${FINISH}$'
    commands:
      - swipe:
          start: 50%, 45%
          end: 50%, 15%
          duration: 600
      - waitForAnimationToEnd:
          timeout: 1500
- repeat:
    times: 8
    while:
      notVisible: '.*${HOME_FEED_TITLE}.*'
    commands:
      - tapOn:
          text: '^${FINISH}$'
          optional: true
      - waitForAnimationToEnd:
          timeout: 3000
      - tapOn:
          text: '^${PUSH_DECLINE}$'
          optional: true
      - waitForAnimationToEnd:
          timeout: 2000

# She is a player now and inside the app.
- extendedWaitUntil:
    visible: '.*${HOME_FEED_TITLE}.*'
    timeout: 120000
- assertVisible:
    text: '^${TAB_HOME}$'
- assertNotVisible:
    id: 'wizard-step-5'
