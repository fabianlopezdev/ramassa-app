appId: com.ramassa.app
name: smoke-profile
# An edit a woman makes to her own record SURVIVES (RAPP-28).
#
# The capture flow photographs the editor; it never types into it. So until
# now nothing in the suite proved that changing a field and pressing Desa
# actually writes anything - and the profile screen is the RGPD surface where
# "see your data and correct it" is the promise being kept.
#
# Persistence is asserted after a RELAUNCH, not straight after the save. Reading
# the value back on the screen that just wrote it proves only that the optimistic
# cache update painted; the write is optimistic, so that assertion passes just as
# happily when the server rejected it and the rollback has not landed yet. A
# relaunch drops the cache and the value can only come back from the database.
#
# The suite rebuilds the seeded database before each platform's run, so what
# this writes is gone by the next run and the flow always starts from the same
# seeded state. Nothing is tagged, and nothing needs cleaning up:
# the row is the seeded fixture's, identified by the account signed into, not by
# anything written into a column the feature under test can rewrite.
env:
  DEV_CLIENT_URL: ramassa://expo-development-client/?url=http%3A%2F%2Flocalhost%3A8081
  DEV_MENU_LABEL: Developer menu
  TAB_PROFILE: '{{nav:tabs.profile}}'
  HOME_FEED_TITLE: '{{home:feedTitle}}'
  PROFILE_TITLE: '{{profile:title}}'
  EDIT_ACTION: '{{profile:editAction}}'
  # `profile:editTitle` is deliberately NOT declared here. It renders the same
  # words as `editAction` above, so any condition written against it is also
  # true on the screen that merely offers the button - which is exactly how this
  # flow came to assert it was in the editor while it was not.
  SAVE_ACTION: '{{profile:saveAction}}'
  SAVE_FAILED: '{{profile:saveFailed}}'
  BACK: '{{onboarding:backAction}}'
  PUSH_DECLINE: '{{push:rationaleDecline}}'
  # ASCII, and distinct from every seeded value, so finding it on screen can
  # only mean this flow put it there. Maestro's inputText cannot type Arabic
  # script; the pgTAP suite covers that storage path server-side instead.
  NEW_BIRTHPLACE: 'Homs'
  ACCOUNTS_SECTION: Accounts and roles
  SHOW_ALL_ACCOUNTS: Show all
  PLAYER_EMAIL: '{{player:email}}'
  PLAYER_WITHOUT_REQUEST_EMAIL: '{{playerWithoutRequest:email}}'
  DELETE_TITLE: '{{profile:deleteTitle}}'
  DELETE_REASON_LABEL: '{{profile:deleteReasonLabel}}'
  DELETE_REASON_PLACEHOLDER: '{{profile:deleteReasonPlaceholder}}'
  DELETE_ACTION: '{{profile:deleteAction}}'
  DELETE_CONFIRM_BODY: '{{profile:deleteConfirmBody}}'
  DELETE_CONFIRM_ACTION: '{{profile:deleteConfirmAction}}'
  DELETE_CONFIRM_CANCEL: '{{profile:deleteConfirmCancel}}'
  DELETE_PENDING_TITLE: '{{profile:deletePendingTitle}}'
---
- runFlow: _open-app.yaml
# Sign in through the seeded account switcher. This flow waits on the current
# feed heading because the shared sign-in fragment still names the retired home
# placeholder heading and cannot prove that the new feed has mounted.
- repeat:
    times: 6
    while:
      notVisible: '.*${ACCOUNTS_SECTION}.*'
    commands:
      - tapOn:
          text: '.*Close.*'
          optional: true
      - tapOn:
          text: '.*${DEV_MENU_LABEL}.*'
          optional: true
      - swipe:
          start: 50%, 70%
          end: 50%, 40%
          duration: 900
      - waitForAnimationToEnd:
          timeout: 3000
- waitForAnimationToEnd:
    timeout: 5000
- repeat:
    times: 20
    while:
      notVisible: '.*${PLAYER_EMAIL}.*'
    commands:
      - swipe:
          start: 50%, 70%
          end: 50%, 50%
          duration: 900
      - waitForAnimationToEnd:
          timeout: 2500
- swipe:
    start: 50%, 65%
    end: 50%, 55%
    duration: 900
- waitForAnimationToEnd:
    timeout: 2500
- tapOn: '.*${PLAYER_EMAIL}.*'
- waitForAnimationToEnd:
    timeout: 3000
- repeat:
    times: 6
    while:
      visible: '.*Close.*'
    commands:
      - tapOn:
          text: '.*Close.*'
          optional: true
      - waitForAnimationToEnd:
          timeout: 3000
- assertNotVisible: '.*Close.*'
- repeat:
    times: 6
    while:
      notVisible: '.*${HOME_FEED_TITLE}.*'
    commands:
      - tapOn:
          text: '^${PUSH_DECLINE}$'
          optional: true
      - tapOn:
          text: '.*Close.*'
          optional: true
      - waitForAnimationToEnd:
          timeout: 3000
- extendedWaitUntil:
    visible: '.*${HOME_FEED_TITLE}.*'
    timeout: 120000
- runFlow:
    commands:
      - stopApp
      - openLink: ${DEV_CLIENT_URL}
      - tapOn:
          text: '^Open$'
          optional: true
      - waitForAnimationToEnd:
          timeout: 3000
      - waitForAnimationToEnd:
          timeout: 12000
      - repeat:
          times: 10
          while:
            notVisible: '.*${HOME_FEED_TITLE}.*'
          commands:
            - tapOn:
                text: '.*Close.*'
                optional: true
            - tapOn:
                text: '^${PUSH_DECLINE}$'
                optional: true
            - tapOn:
                text: '^${BACK}$'
                optional: true
            - waitForAnimationToEnd:
                timeout: 3000
      - repeat:
          times: 6
          while:
            visible: '^${PUSH_DECLINE}$'
          commands:
            - tapOn: '^${PUSH_DECLINE}$'
            - waitForAnimationToEnd:
                timeout: 3000
      - repeat:
          times: 4
          while:
            visible: '.*Close.*'
          commands:
            - tapOn: '.*Close.*'
            - waitForAnimationToEnd:
                timeout: 3000
      - waitForAnimationToEnd:
          timeout: 5000
      - repeat:
          times: 6
          while:
            notVisible: '.*${HOME_FEED_TITLE}.*'
          commands:
            - tapOn:
                text: '^${BACK}$'
                optional: true
            - waitForAnimationToEnd:
                timeout: 3000
      - extendedWaitUntil:
          visible: '.*${HOME_FEED_TITLE}.*'
          timeout: 240000

# Reaching Profile is a LOOP, because a single tab tap can land on the WRONG
# tab: the tab bar is a floating pill that animates into place after a relaunch,
# and a touch dispatched against its pre-settle layout selects a neighbour.
#
# Keyed on the profile HEADING, not the dev-menu entry. The entry is the last
# thing on the screen and sits below the fold now that the tab holds a real
# record, and Maestro does not match off-screen nodes on Android - so a loop
# waiting for it would run its full six iterations every time and then be
# rescued by the wait below, which is a slow way of testing nothing. The heading
# is at the top and appears on no other tab.
- repeat:
    times: 6
    while:
      notVisible: '.*${PROFILE_TITLE}.*'
    commands:
      - tapOn:
          text: '^${TAB_PROFILE}$'
          optional: true
      - tapOn:
          text: '^${PUSH_DECLINE}$'
          optional: true
      - tapOn:
          text: '.*Close.*'
          optional: true
      - waitForAnimationToEnd:
          timeout: 3000
- extendedWaitUntil:
    visible: '.*${PROFILE_TITLE}.*'
    timeout: 15000

# ── Into the editor ────────────────────────────────────────────────────────
- repeat:
    times: 10
    while:
      notVisible: '^${EDIT_ACTION}$'
    commands:
      - swipe:
          start: 50%, 60%
          end: 50%, 40%
          duration: 900
      - waitForAnimationToEnd:
          timeout: 1500
# The loop stops the instant a sliver is on screen, which parks the control
# under the tab bar where a tap does not reach it. One smaller swipe lifts it.
- swipe:
    start: 50%, 60%
    end: 50%, 52%
    duration: 900
- waitForAnimationToEnd:
    timeout: 2000
# Keyed on the FIELD, not on the editor's title.
#
# `profile:editAction` and `profile:editTitle` are the same words - "Edita les
# meves dades" labels both the button on the profile screen and the header of
# the screen it opens. A loop waiting for the title was therefore already
# satisfied by the BUTTON, skipped without ever tapping it, and the flow went
# looking for form fields while still on the profile screen. It reported the
# field as missing, which sent me hunting a scrolling problem that did not
# exist.
#
# The field id is the honest signal: it appears only in the editor, and only in
# its LOADED state (the loading branch draws placeholders and the failed-read
# branch draws a retry, and neither renders a single input). So this proves
# navigation and readiness in one condition, and it cannot be satisfied by the
# screen we are leaving.
- repeat:
    times: 6
    while:
      notVisible:
        id: 'profile-edit-place-of-birth'
    commands:
      - tapOn:
          text: '^${EDIT_ACTION}$'
          optional: true
      - waitForAnimationToEnd:
          timeout: 2500
- extendedWaitUntil:
    visible:
      id: 'profile-edit-place-of-birth'
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 2000

# ── Fill in where she was born ────────────────────────────────────────────────────────
# By testID: the label is rendered twice on this control (visible caption and
# the input's accessibility label), so matching on its text can resolve to the
# caption, which nothing can type into.
#
# Place of birth, and not the phone number this flow first edited. The claim
# being tested is "an edit survives a relaunch", so any field proves it, and
# this one is the only field that avoids both traps at once: it is near the top
# of BOTH this screen and the profile screen, so nothing has to be scrolled to,
# and the seed leaves it empty, so nothing has to be erased. The phone number
# failed on the first (six to eight screens down a form carrying the whole
# intake) and her name failed on the second.
- tapOn:
    text: '^Cancel$'
    optional: true
- tapOn:
    id: 'profile-edit-place-of-birth'
# No erase, deliberately. `eraseText` removes a character at a time through the
# Android driver and hung on this participant's Arabic-script name until
# Maestro's own two-minute deadline killed the run. The seed leaves her place of
# birth NULL on purpose (two rows keep a null so the "profile created before
# this field existed" case stays covered), so there is nothing to clear and
# `inputText` has nothing to append to.
- inputText: ${NEW_BIRTHPLACE}
- waitForAnimationToEnd:
    timeout: 1500
# The Catalan keyboard exposes its action key as "Desa" too. While it remains
# open, Maestro can satisfy SAVE_ACTION with the IME key instead of the app's
# button, stop scrolling early, and leave the form unsaved. Submit the
# single-line field with Enter, which blurs it on both platforms, before looking
# for the primary action so there is only one honest match.
- pressKey: Enter
- waitForAnimationToEnd:
    timeout: 1500

# Save. The button sits below the fold on a form this long once the keyboard
# has been up. It is dismissed above, but the form keeps its scroll position.
- repeat:
    times: 20
    while:
      notVisible: '^${SAVE_ACTION}$'
    commands:
      - swipe:
          start: 50%, 45%
          end: 50%, 25%
          duration: 900
      - waitForAnimationToEnd:
          timeout: 1500
# Keyed on the EDIT BUTTON, not on the profile heading.
#
# Returning from the editor restores the scroll position this flow left the
# profile screen at - part-way down, because it had to scroll to reach that
# button in the first place - so the heading is above the fold and unmatchable
# on Android. The save had worked and the screen was correct; the assertion was
# simply looking at a part of it that was not on screen. The button is where the
# flow already knows the screen is scrolled to, and it exists on no other
# screen: the editor does not render it.
- repeat:
    times: 6
    while:
      notVisible: '^${EDIT_ACTION}$'
    commands:
      - tapOn:
          text: '^${SAVE_ACTION}$'
          optional: true
      - waitForAnimationToEnd:
          timeout: 3000

# Leaving the editor IS the success signal, and only the success signal: a
# rejected save deliberately keeps her on this screen with her edits intact, so
# landing back on the profile cannot happen on the failure path.
- extendedWaitUntil:
    visible: '^${EDIT_ACTION}$'
    timeout: 60000
# Belt and braces on the same fact, and safe to assert as an absence only
# because the wait above has already proved something PRESENT on the screen
# that replaced it.
- assertNotVisible: '.*${SAVE_FAILED}.*'

# ── The point: it survives a relaunch ──────────────────────────────────────
# Everything above passes against a purely optimistic write. This is the part
# that cannot: the process is killed, the query cache goes with it, and the name
# can only reappear by having been read back from the database.
- runFlow:
    commands:
      - stopApp
      - openLink: ${DEV_CLIENT_URL}
      - tapOn:
          text: '^Open$'
          optional: true
      - waitForAnimationToEnd:
          timeout: 3000
      - waitForAnimationToEnd:
          timeout: 12000
      - repeat:
          times: 10
          while:
            notVisible: '.*${HOME_FEED_TITLE}.*'
          commands:
            - tapOn:
                text: '.*Close.*'
                optional: true
            - tapOn:
                text: '^${PUSH_DECLINE}$'
                optional: true
            - tapOn:
                text: '^${BACK}$'
                optional: true
            - waitForAnimationToEnd:
                timeout: 3000
      - repeat:
          times: 6
          while:
            visible: '^${PUSH_DECLINE}$'
          commands:
            - tapOn: '^${PUSH_DECLINE}$'
            - waitForAnimationToEnd:
                timeout: 3000
      - repeat:
          times: 4
          while:
            visible: '.*Close.*'
          commands:
            - tapOn: '.*Close.*'
            - waitForAnimationToEnd:
                timeout: 3000
      - waitForAnimationToEnd:
          timeout: 5000
      - repeat:
          times: 6
          while:
            notVisible: '.*${HOME_FEED_TITLE}.*'
          commands:
            - tapOn:
                text: '^${BACK}$'
                optional: true
            - waitForAnimationToEnd:
                timeout: 3000
      - extendedWaitUntil:
          visible: '.*${HOME_FEED_TITLE}.*'
          timeout: 240000
- repeat:
    times: 6
    while:
      notVisible: '.*${PROFILE_TITLE}.*'
    commands:
      - tapOn:
          text: '^${TAB_PROFILE}$'
          optional: true
      - tapOn:
          text: '^${PUSH_DECLINE}$'
          optional: true
      - tapOn:
          text: '.*Close.*'
          optional: true
      - waitForAnimationToEnd:
          timeout: 3000
- extendedWaitUntil:
    visible: '.*${PROFILE_TITLE}.*'
    timeout: 30000
- repeat:
    times: 20
    while:
      notVisible: '.*${NEW_BIRTHPLACE}.*'
    commands:
      - swipe:
          start: 50%, 60%
          end: 50%, 40%
          duration: 900
      - waitForAnimationToEnd:
          timeout: 1500
- extendedWaitUntil:
    visible: '.*${NEW_BIRTHPLACE}.*'
    timeout: 30000

# The erasure form is unreachable for the player used above because the seed
# deliberately gives her an open request. Switch to the seeded player without
# one, then prove the confirmation, cancellation, system back, and final
# destructive submission from a clean request state.
- repeat:
    times: 20
    while:
      notVisible: '.*${DEV_MENU_LABEL}.*'
    commands:
      - swipe:
          start: 50%, 65%
          end: 50%, 35%
          duration: 900
      - waitForAnimationToEnd:
          timeout: 1500
- tapOn: '.*${DEV_MENU_LABEL}.*'
- waitForAnimationToEnd:
    timeout: 4000
- repeat:
    times: 12
    while:
      notVisible: '.*${SHOW_ALL_ACCOUNTS}.*'
    commands:
      - swipe:
          start: 50%, 70%
          end: 50%, 50%
          duration: 900
      - waitForAnimationToEnd:
          timeout: 2000
- tapOn: '.*${SHOW_ALL_ACCOUNTS}.*'
- waitForAnimationToEnd:
    timeout: 2500
- repeat:
    times: 20
    while:
      notVisible: '.*${PLAYER_WITHOUT_REQUEST_EMAIL}.*'
    commands:
      - swipe:
          start: 50%, 70%
          end: 50%, 50%
          duration: 900
      - waitForAnimationToEnd:
          timeout: 2000
- swipe:
    start: 50%, 65%
    end: 50%, 55%
    duration: 900
- waitForAnimationToEnd:
    timeout: 2000
- tapOn: '.*${PLAYER_WITHOUT_REQUEST_EMAIL}.*'
- waitForAnimationToEnd:
    timeout: 3000
- repeat:
    times: 6
    while:
      visible: '.*Close.*'
    commands:
      - tapOn:
          text: '.*Close.*'
          optional: true
      - waitForAnimationToEnd:
          timeout: 3000

- runFlow:
    commands:
      - stopApp
      - openLink: ${DEV_CLIENT_URL}
      - tapOn:
          text: '^Open$'
          optional: true
      - waitForAnimationToEnd:
          timeout: 3000
      - waitForAnimationToEnd:
          timeout: 12000
      - repeat:
          times: 10
          while:
            notVisible: '.*${HOME_FEED_TITLE}.*'
          commands:
            - tapOn:
                text: '.*Close.*'
                optional: true
            - tapOn:
                text: '^${PUSH_DECLINE}$'
                optional: true
            - tapOn:
                text: '^${BACK}$'
                optional: true
            - waitForAnimationToEnd:
                timeout: 3000
      - repeat:
          times: 6
          while:
            visible: '^${PUSH_DECLINE}$'
          commands:
            - tapOn: '^${PUSH_DECLINE}$'
            - waitForAnimationToEnd:
                timeout: 3000
      - repeat:
          times: 4
          while:
            visible: '.*Close.*'
          commands:
            - tapOn: '.*Close.*'
            - waitForAnimationToEnd:
                timeout: 3000
      - waitForAnimationToEnd:
          timeout: 5000
      - repeat:
          times: 6
          while:
            notVisible: '.*${HOME_FEED_TITLE}.*'
          commands:
            - tapOn:
                text: '^${BACK}$'
                optional: true
            - waitForAnimationToEnd:
                timeout: 3000
      - extendedWaitUntil:
          visible: '.*${HOME_FEED_TITLE}.*'
          timeout: 240000
- repeat:
    times: 6
    while:
      notVisible: '.*${PROFILE_TITLE}.*'
    commands:
      - tapOn:
          text: '^${TAB_PROFILE}$'
          optional: true
      - tapOn:
          text: '^${PUSH_DECLINE}$'
          optional: true
      - tapOn:
          text: '.*Close.*'
          optional: true
      - waitForAnimationToEnd:
          timeout: 3000
- extendedWaitUntil:
    visible: '.*${PROFILE_TITLE}.*'
    timeout: 30000
- repeat:
    times: 20
    while:
      notVisible: '^${DELETE_TITLE}$'
    commands:
      - swipe:
          start: 50%, 65%
          end: 50%, 40%
          duration: 900
      - waitForAnimationToEnd:
          timeout: 1500
- swipe:
    start: 50%, 60%
    end: 50%, 35%
    duration: 900
- waitForAnimationToEnd:
    timeout: 2000
- tapOn: '^${DELETE_TITLE}$'
- extendedWaitUntil:
    visible: '^${DELETE_ACTION}$'
    timeout: 30000
- tapOn: '^${DELETE_REASON_PLACEHOLDER}$'
- inputText: 'QA RAPP 105'
- hideKeyboard
- waitForAnimationToEnd:
    timeout: 2000
- extendedWaitUntil:
    visible: '^${DELETE_ACTION}$'
    timeout: 15000
- tapOn: '^${DELETE_ACTION}$'
- extendedWaitUntil:
    visible: '.*${DELETE_CONFIRM_BODY}.*'
    timeout: 15000
- assertVisible: '^${DELETE_CONFIRM_ACTION}$'
- runFlow:
    when:
      platform: Android
    commands:
      - back
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn:
          id: profile-delete-confirm-cancel
- extendedWaitUntil:
    visible: '^${DELETE_ACTION}$'
    timeout: 15000
- assertNotVisible: '.*${DELETE_CONFIRM_BODY}.*'

# Exercise the visible cancel control independently from Android's system back.
- tapOn: '^${DELETE_ACTION}$'
- extendedWaitUntil:
    visible: '.*${DELETE_CONFIRM_BODY}.*'
    timeout: 15000
- tapOn:
    id: profile-delete-confirm-cancel
- extendedWaitUntil:
    visible: '^${DELETE_ACTION}$'
    timeout: 15000
- assertNotVisible: '.*${DELETE_CONFIRM_BODY}.*'

# Reopen and deliberately double-tap the destructive action. The screen must
# accept one request, return to the profile, and show the pending state instead
# of sending a second request from the same gesture.
- tapOn: '^${DELETE_ACTION}$'
- extendedWaitUntil:
    visible: '.*${DELETE_CONFIRM_BODY}.*'
    timeout: 15000
- doubleTapOn:
    id: profile-delete-confirm
    delay: 100
- extendedWaitUntil:
    visible: '.*${DELETE_PENDING_TITLE}.*'
    timeout: 30000
- assertNotVisible: '.*${DELETE_CONFIRM_BODY}.*'
