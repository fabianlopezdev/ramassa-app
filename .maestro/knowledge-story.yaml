appId: com.ramassa.app
name: knowledge-story
# Browse a real structured article, then submit a consented story and observe
# the server-backed submitted status.
env:
  DEV_CLIENT_URL: ramassa://expo-development-client/?url=http%3A%2F%2Flocalhost%3A8081
  BACK: '{{common:back}}'
  TAB_HOME: '{{nav:tabs.home}}'
  PLAYER_TITLE: '{{knowledge:playerTitle}}'
  SUBMISSION_TITLE: '{{knowledge:submissionTitle}}'
  SUCCESS_TITLE: '{{knowledge:submissionSuccessTitle}}'
  PUSH_DECLINE: '{{push:rationaleDecline}}'
---
- runFlow: _open-app.yaml
- runFlow: _sign-in.yaml
- runFlow: _relaunch.yaml
- tapOn:
    id: open-knowledge-base
- extendedWaitUntil:
    visible: '.*${PLAYER_TITLE}.*'
    timeout: 30000
- assertVisible:
    id: knowledge-base-screen
- tapOn:
    id: knowledge-filter-5eed0000-0000-4000-8004-000000000002
- repeat:
    times: 8
    while:
      notVisible:
        id: knowledge-article-5eed0000-0000-4000-8005-000000000001
    commands:
      - swipe:
          start: 50%, 76%
          end: 50%, 42%
          duration: 800
      - waitForAnimationToEnd:
          timeout: 1200
- tapOn:
    id: knowledge-article-5eed0000-0000-4000-8005-000000000001
- extendedWaitUntil:
    visible:
      id: knowledge-detail-screen
    timeout: 30000
- tapOn:
    id: knowledge-detail-back
    point: 50%, 50%
- extendedWaitUntil:
    visible:
      id: knowledge-base-screen
    timeout: 30000
- tapOn:
    id: knowledge-back
    point: 50%, 50%
- repeat:
    times: 6
    while:
      notVisible:
        id: open-story-submission
    commands:
      - tapOn:
          text: '^${PUSH_DECLINE}$'
          optional: true
      - waitForAnimationToEnd:
          timeout: 2500
- tapOn:
    id: open-story-submission
- extendedWaitUntil:
    visible: '.*${SUBMISSION_TITLE}.*'
    timeout: 30000
- tapOn:
    id: story-title-input
- inputText: 'Closure story'
- tapOn:
    id: story-body-input
- inputText: 'Playing football helped me feel welcome and supported.'
# The consent and submit controls sit behind the keyboard. The hide command
# alone does not close it over this multi-line field on iOS 27, so the blank
# band under the back button is tapped too: the screen drops the keyboard on a
# tap outside any control.
- hideKeyboard
- tapOn:
    point: 50%, 15%
- waitForAnimationToEnd:
    timeout: 1500
# iOS lists the consent switch and the submit button in its hierarchy while
# they are still below the fold, so the loops below can believe they have
# arrived and tap at bounds that are off screen, which lands on the story text
# and reopens the keyboard. Reach the bottom of the form first with a fixed
# number of drags, which needs no visibility condition. The drags start below
# the story field so none of them lands in it.
- repeat:
    times: 4
    commands:
      - swipe:
          start: 50%, 80%
          end: 50%, 30%
          duration: 800
      - waitForAnimationToEnd:
          timeout: 1000
- repeat:
    times: 8
    while:
      notVisible:
        id: story-publication-consent
    commands:
      - swipe:
          start: 50%, 76%
          end: 50%, 40%
          duration: 800
      - waitForAnimationToEnd:
          timeout: 1000
# Consent and submit until the outcome shows, never tap-then-assert (RAPP-500).
# On iOS 27 a tap at the bottom of this form can land in the story field and
# reopen the keyboard, and the next tap at the consent or submit bounds then
# types a letter instead. Each pass hides the keyboard, brings the button back into view and
# taps it; the loop ends on the success title, so a missed tap is retried and a
# landed one is never repeated.
- repeat:
    times: 4
    while:
      notVisible: '.*${SUCCESS_TITLE}.*'
    commands:
      # `hideKeyboard` does not drop it over this multi-line field on iOS 27.
      # A tap on the heading does: the form's scroll view dismisses the
      # keyboard on any tap outside an input. Scroll up to reach the heading.
      - repeat:
          times: 4
          while:
            notVisible: '^${SUBMISSION_TITLE}$'
          commands:
            - swipe:
                start: 50%, 30%
                end: 50%, 80%
                duration: 800
      - tapOn:
          text: '^${SUBMISSION_TITLE}$'
          optional: true
      - waitForAnimationToEnd:
          timeout: 2000
      # Back to the bottom with fixed drags, as above: iOS reports the button
      # visible while it is still below the fold.
      - repeat:
          times: 4
          commands:
            - swipe:
                start: 50%, 80%
                end: 50%, 30%
                duration: 800
            - waitForAnimationToEnd:
                timeout: 1000
      # Consent until it reads as checked: a tap at its bounds while the
      # keyboard was up typed a letter into the story instead.
      - repeat:
          times: 3
          while:
            notVisible:
              id: story-publication-consent
              checked: true
          commands:
            - tapOn:
                id: story-publication-consent
                optional: true
            - waitForAnimationToEnd:
                timeout: 1500
      - repeat:
          times: 6
          while:
            notVisible:
              id: story-submit-button
          commands:
            - swipe:
                start: 50%, 76%
                end: 50%, 48%
                duration: 800
            - waitForAnimationToEnd:
                timeout: 1000
      - tapOn:
          id: story-submit-button
          enabled: true
          optional: true
      - waitForAnimationToEnd:
          timeout: 5000
- extendedWaitUntil:
    visible: '.*${SUCCESS_TITLE}.*'
    timeout: 60000
- assertVisible:
    id: story-status-submitted
