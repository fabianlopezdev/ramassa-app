appId: com.ramassa.app
name: _phase8-survey-journey
---
- extendedWaitUntil:
    visible:
      id: survey-prompt-action
    timeout: 60000
- tapOn:
    id: survey-prompt-action
- extendedWaitUntil:
    visible:
      id: survey-rating-4
    timeout: 30000
- tapOn:
    id: survey-rating-4
- tapOn:
    id: survey-next
- extendedWaitUntil:
    visible:
      id: survey-choice-training
    timeout: 30000
- tapOn:
    id: survey-choice-training
- tapOn:
    id: survey-next
- extendedWaitUntil:
    visible:
      id: survey-yes
    timeout: 30000
- tapOn:
    id: survey-yes
- tapOn:
    id: survey-next
- extendedWaitUntil:
    visible:
      id: survey-free-text
    timeout: 30000
- tapOn:
    id: survey-free-text
- inputText: rapp61-survey-response
# iOS 27 no longer drops the keyboard when the screen is dragged, and the next
# control then sits behind it. The hide command works on both platforms in
# Catalan, but in Arabic it reports success with the keyboard still up. The
# screen drops the keyboard on a tap outside any control, so the question
# heading is tapped too. Submit UNTIL the completion shows, so a tap that hit a
# key is simply retried.
- repeat:
    times: 4
    while:
      notVisible:
        id: survey-completion
    commands:
      - hideKeyboard
      - tapOn:
          point: 50%, 30%
      - waitForAnimationToEnd:
          timeout: 1500
      - tapOn:
          id: survey-next
      - waitForAnimationToEnd:
          timeout: 3000
- extendedWaitUntil:
    visible:
      id: survey-completion
    timeout: 30000
