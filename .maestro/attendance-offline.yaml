appId: com.ramassa.app
name: attendance-offline
env:
  DEV_CLIENT_URL: ramassa://expo-development-client/?url=http%3A%2F%2Flocalhost%3A8082
  DEV_MENU_LABEL: Developer menu
  LOCALE: ca
  STAFF_EMAIL: '{{staffOnly:email}}'
  LOGIN_TITLE: '{{auth:loginTitle}}'
  ATTENDANCE_TITLE: '{{attendance:title}}'
  ACCOUNTS_SECTION: Accounts and roles
  PUSH_DECLINE: '{{push:rationaleDecline}}'
  OFFLINE_BANNER: '{{attendance:offlineBanner}}'
---
- runFlow:
    file: _open-app.yaml
    env:
      DEV_CLIENT_URL: ${DEV_CLIENT_URL}
      DEV_MENU_LABEL: ${DEV_MENU_LABEL}
      LOCALE: ${LOCALE}
# Attendance needs the seeded staff identity. The shared sign-in fragment owns
# a player default, so this flow selects the staff fixture directly.
- repeat:
    times: 6
    while:
      notVisible: '.*${ACCOUNTS_SECTION}.*'
    commands:
      - tapOn:
          text: '.*Close.*'
          optional: true
      - tapOn:
          text: '.*${DEV_MENU_LABEL}.*'
          optional: true
      - waitForAnimationToEnd:
          timeout: 3000
- extendedWaitUntil:
    visible: '.*${ACCOUNTS_SECTION}.*'
    timeout: 15000
- waitForAnimationToEnd:
    timeout: 5000
- repeat:
    times: 20
    while:
      notVisible: '.*${STAFF_EMAIL}.*'
    commands:
      - swipe:
          start: 50%, 70%
          end: 50%, 50%
          duration: 900
      - waitForAnimationToEnd:
          timeout: 2500
- swipe:
    start: 50%, 65%
    end: 50%, 55%
    duration: 900
- waitForAnimationToEnd:
    timeout: 2500
- tapOn: '.*${STAFF_EMAIL}.*'
- waitForAnimationToEnd:
    timeout: 10000
- repeat:
    times: 6
    while:
      visible: '.*Close.*'
    commands:
      - tapOn:
          text: '.*Close.*'
          optional: true
      - waitForAnimationToEnd:
          timeout: 3000
- assertNotVisible: '.*${LOGIN_TITLE}.*'
- tapOn:
    text: '^${PUSH_DECLINE}$'
    optional: true
- waitForAnimationToEnd:
    timeout: 2500
- extendedWaitUntil:
    visible: '.*${ATTENDANCE_TITLE}.*'
    timeout: 30000
- tapOn: ".*Sessió d'entrenament d'avui.*"
- extendedWaitUntil:
    visible:
      id: attendance-player-5eed0000-0000-4000-8000-000000000012
    timeout: 30000

# Android is the primary offline target. iOS still proves that this cumulative
# flow reaches the same native attendance sheet, while the Android branch below
# proves queue persistence and reconnect delivery with real airplane mode.
- runFlow:
    when:
      platform: Android
    commands:
      - toggleAirplaneMode
      - extendedWaitUntil:
          visible: '.*${OFFLINE_BANNER}.*'
          timeout: 30000
      - tapOn:
          id: attendance-player-5eed0000-0000-4000-8000-000000000012
      - extendedWaitUntil:
          visible:
            id: attendance-sync-5eed0000-0000-4000-8000-000000000012-pending
          timeout: 30000
      - stopApp
      - openLink: ${DEV_CLIENT_URL}
      - waitForAnimationToEnd:
          timeout: 12000
      # The dev-client deep link restarts the native process while airplane mode
      # is still on. Reconnect next, then reopen the sheet from the staff root.
      # The final server-backed state proves that the persisted outbox drained
      # after the cold start, without relying on restored navigation state.
      - toggleAirplaneMode
      - repeat:
          times: 12
          while:
            notVisible: '.*${ATTENDANCE_TITLE}.*'
          commands:
            - tapOn:
                text: '^${PUSH_DECLINE}$'
                optional: true
            - tapOn:
                text: '.*Close.*'
                optional: true
            - waitForAnimationToEnd:
                timeout: 3000
      - extendedWaitUntil:
          visible: '.*${ATTENDANCE_TITLE}.*'
          timeout: 240000
      - tapOn: ".*Sessió d'entrenament d'avui.*"
      - extendedWaitUntil:
          visible:
            id: attendance-status-5eed0000-0000-4000-8000-000000000012-excused
          timeout: 30000
      - assertVisible:
          id: attendance-sync-5eed0000-0000-4000-8000-000000000012-synced
