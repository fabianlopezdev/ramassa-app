appId: com.ramassa.app
name: _sign-in
# Signs in as a seeded player through the dev menu's account link. A
# fragment: `smoke-auth` exercises this path as its
# subject, the others just need to be past it.
#
# There is no client-side role to fake: role lives in `profiles.role`, resolved
# from the session, so the link signs in for real against the local seeded
# stack. That is also what makes it deterministic - `supabase db reset` rebuilds
# exactly these accounts.
env:
  DEV_MENU_LINK: ramassa://dev-menu
  PLAYER_EMAIL: '{{player:email}}'
  LOGIN_TITLE: '{{auth:emailLoginTitle}}'
---
# One link opens the menu AND signs in (RAPP-500): the menu signs in as the
# seeded account named by `?account=`, with the same password sign-in its
# account rows use, then prints "applied: signed in as <email>" at the top.
# Scrolling the menu to the row cost about a minute per flow; this costs
# seconds, and the sign-in itself is unchanged.
#
# Still a LOOP: a link landing while the client's explainer sheet is mid-flight
# can be dropped. The result line names the account, so a line left by an
# earlier request cannot satisfy this one.
- repeat:
    times: 6
    while:
      notVisible: '.*signed in as ${PLAYER_EMAIL}.*'
    commands:
      - openLink: ${DEV_MENU_LINK}?account=${PLAYER_EMAIL}
      - waitForAnimationToEnd:
          timeout: 3000
      - extendedWaitUntil:
          visible: '.*signed in as ${PLAYER_EMAIL}.*'
          timeout: 10000
          optional: true
- extendedWaitUntil:
    visible: '.*signed in as ${PLAYER_EMAIL}.*'
    timeout: 30000

# Close the dev menu. Signing in does NOT dismiss it: the session changes
# underneath, so nothing is waitable until the menu is out of the way.
# Closing the menu is a LOOP too. Selecting a language re-renders the section, and
# a tap dispatched into that re-render finds no `Close` in the hierarchy at all,
# even though a screenshot taken a moment later shows it plainly.
#
# The loop keys on `Close` rather than on a section title. A section title is the
# wrong proxy for "the menu is open": by this point the menu is scrolled down to
# the language buttons, so the FIRST section is above the fold, the loop reads
# that as already closed, runs zero times, and the assertion passes on a menu
# still filling the screen. `Close` is pinned to the header and exists only while
# the menu is open.
- repeat:
    times: 6
    while:
      visible:
        id: dev-menu-close
    commands:
      - tapOn:
          id: dev-menu-close
          optional: true
      - waitForAnimationToEnd:
          timeout: 3000
- assertNotVisible:
    id: dev-menu-close

# Assert the OUTCOME, not the dev menu's "Signed in as ..." line. That line is
# local component state rendered AFTER the whole account list, so it sits below
# the row just tapped and no amount of waiting brings it into view. Successful
# sign-in can land on Home OR restore a valid pushed player route, so a specific
# screen or tab is not an authentication predicate. The email login heading,
# where `_open-app.yaml` leaves the app, remains on a failed sign-in and
# disappears on every valid signed-in route.
- assertNotVisible: '.*${LOGIN_TITLE}.*'
