appId: com.ramassa.app
name: _set-language
# Pins the app language through the dev menu, from wherever the app currently is.
#
# A fragment of its own, and run by `_open-app.yaml` BEFORE anything is asserted,
# because a fresh `clearState` leaves no persisted choice and the app then
# follows the DEVICE locale. On an en-US emulator that renders the login screen
# in English while the suite resolves its selectors in Catalan, which fails as
# "Inici de sessio is not visible" and reads like a broken login screen rather
# than a locale mismatch.
#
# The menu is opened by its own route rather than by its entry, which sits on
# the signed-in Profile tab only. The route answers in every dev build, signed
# in or not, so the language can still be pinned before anyone signs in.
env:
  DEV_MENU_LINK: ramassa://dev-menu
---
# One link opens the menu AND pins the language (RAPP-500): the menu applies
# `?language=` through the same `setLanguage` its buttons call, then prints
# "applied: language <code>" at the top. Scrolling to the language buttons and
# tapping until selected cost about a minute per flow; this costs seconds.
#
# Still a LOOP: a link landing while the client's explainer sheet is mid-flight
# can be dropped, so it is re-sent until the result line is on screen. The
# result line names the language, so a line left by an earlier request cannot
# satisfy this one.
- repeat:
    times: 6
    while:
      notVisible: '.*applied: language ${LOCALE}.*'
    commands:
      - openLink: ${DEV_MENU_LINK}?language=${LOCALE}
      - tapOn:
          text: '^Open$'
          optional: true
      - waitForAnimationToEnd:
          timeout: 3000
- extendedWaitUntil:
    visible: '.*applied: language ${LOCALE}.*'
    timeout: 15000

# Crossing between LTR and RTL changes I18nManager for the next native start.
# Let the app perform its supported reload while the dev menu still exposes the
# action; a later force-stop/open can otherwise race React Native applying the
# direction change and reopen in the previous language on Android.
- runFlow:
    when:
      visible: '^Reload app to apply direction$'
    commands:
      - tapOn: '^Reload app to apply direction$'
      - waitForAnimationToEnd:
          timeout: 12000

# Back to whatever screen the caller was on; the close control is English at
# every language, being a __DEV__ surface.
# Closing the menu is a LOOP too. Selecting a language re-renders the section, and
# a tap dispatched into that re-render finds no `Close` in the hierarchy at all,
# even though a screenshot taken a moment later shows it plainly.
#
# The loop keys on `Close` rather than on a section title. A section title is the
# wrong proxy for "the menu is open": by this point the menu is scrolled down to
# the language buttons, so the FIRST section is above the fold, the loop reads
# that as already closed, runs zero times, and the assertion passes on a menu
# still filling the screen. The close control is pinned to the header and exists
# only while the menu is open.
#
# Matched loosely (`.*Close.*`) because the two platforms expose it differently:
# Android surfaces the inner text node, a bare "Close", while iOS surfaces the
# Pressable's accessibility label, "Close the developer menu". An anchored
# `^Close$` therefore matches on Android and can never match on iOS, and the
# symptom is not a failed tap: the loop reads the menu as already closed, skips,
# and the assertion passes while the menu fills the screen.
- repeat:
    times: 6
    while:
      visible:
        id: dev-menu-close
    commands:
      - tapOn:
          id: dev-menu-close
          optional: true
      - waitForAnimationToEnd:
          timeout: 3000
- assertNotVisible:
    id: dev-menu-close
