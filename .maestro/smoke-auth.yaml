appId: com.ramassa.app
name: smoke-auth
# Cold start -> sign in -> land in the player shell -> sign out -> back at login.
# The auth guard is the thing under test: the root navigator routes by session,
# so signing in and out must move between the two route groups with no manual
# navigation anywhere in this flow.
env:
  DEV_CLIENT_URL: ramassa://expo-development-client/?url=http%3A%2F%2Flocalhost%3A8081
  BACK: '{{common:back}}'
  PUSH_DECLINE: '{{push:rationaleDecline}}'
  DEV_MENU_LABEL: Developer menu
  LOGIN_TITLE: '{{auth:loginTitle}}'
  PROFILE_TITLE: '{{profile:title}}'
  SIGN_OUT: '{{auth:signOutAction}}'
  TAB_HOME: '{{nav:tabs.home}}'
  TAB_PROFILE: '{{nav:tabs.profile}}'
---
- runFlow: _open-app.yaml
# Cold start with no session lands on login, not on the app.
- assertVisible: '.*${LOGIN_TITLE}.*'
- runFlow: _sign-in.yaml
- runFlow: _relaunch.yaml

# Signed in: the player shell, not the login screen. Its fixed tab remains valid
# when the router retains any screen inside that shell.
- assertVisible:
    text: '^${TAB_HOME}$'
- assertNotVisible: '.*${LOGIN_TITLE}.*'

# Sign-out lives on Profile, below the Home screen's viewport. Navigate by the
# fixed tab and prove the destination heading before targeting that control.
- repeat:
    times: 3
    while:
      notVisible: '.*${PROFILE_TITLE}.*'
    commands:
      - tapOn:
          text: '^${TAB_PROFILE}$'
      - waitForAnimationToEnd:
          timeout: 3000
- extendedWaitUntil:
    visible: '.*${PROFILE_TITLE}.*'
    timeout: 30000
- repeat:
    times: 20
    while:
      notVisible: '^${SIGN_OUT}$'
    commands:
      - swipe:
          start: 50%, 70%
          end: 50%, 50%
          duration: 900
      - waitForAnimationToEnd:
          timeout: 2500
- extendedWaitUntil:
    visible: '^${SIGN_OUT}$'
    timeout: 30000

# Signing out clears the session and the guard flips back on its own.
- tapOn:
    id: profile-sign-out
    point: 50%, 50%
- extendedWaitUntil:
    visible: '.*${LOGIN_TITLE}.*'
    timeout: 60000
- assertNotVisible:
    text: '^${TAB_HOME}$'
