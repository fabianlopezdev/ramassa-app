appId: com.ramassa.app
name: i18n-rtl
# `bun run capture:flow i18n-rtl` REWRITES this block per run (a flow's own env
# wins over `maestro -e`, so the values have to be baked in, not passed alongside).
# The `{{namespace:key}}` entries are resolved from the app's own locale catalogs,
# so no screen name is ever hardcoded here.
#
# This flow is the ONE exception to the two-pass rule: it is ABOUT the language
# switch, so it drives both languages itself in a single pass rather than being
# run twice. `LOCALE`/`SUFFIX` still exist because the harness sets them, but the
# Arabic shots here are named explicitly.
env:
  SHOTS: maestro/shots/i18n-rtl/ca/ios
  SUFFIX: ''
  LOCALE: ca
  DEV_CLIENT_URL: ramassa://expo-development-client/?url=http%3A%2F%2Flocalhost%3A8081
  PLAYER_EMAIL: '{{player:email}}'
  HOME_TITLE: '{{home:title}}'
  PUSH_DECLINE: '{{push:rationaleDecline}}'
  TAB_HOME: '{{nav:tabs.home}}'
  TAB_PROFILE: '{{nav:tabs.profile}}'
  TAB_HOME_AR: الرئيسية
  TAB_PROFILE_AR: الملف الشخصي
---
# Five languages, two reading directions, and the thing that is easy to get
# wrong: React Native applies a layout-direction flip on the NEXT app start only,
# so a switch that looks right in the moment can still be laying out
# left-to-right until a relaunch. The shots are before, after, and after the
# relaunch, which is the only sequence that shows that honestly.
- clearState
- openLink: ${DEV_CLIENT_URL}
# iOS asks "Open in <app>?" before it will follow a custom-scheme link, and
# nothing dismisses that for you: the app never opens and the flow times out on
# its first assertion, which reads as a bundle that would not load. Optional so
# the identical line is a harmless no-op on Android, which does not ask.
- tapOn:
    text: '^Open$'
    optional: true
- waitForAnimationToEnd:
    timeout: 3000
- extendedWaitUntil:
    visible: '.*Developer menu.*'
    timeout: 240000

# The development client's explainer sheet lands on top of the app a second or
# two AFTER the first render. Dismiss by the ✕ ("Close" on both platforms), never
# by "Continue" (that opens the client's tools menu) and never by the backdrop
# (a no-op on Android).
- waitForAnimationToEnd:
    timeout: 12000
- repeat:
    times: 4
    while:
      visible: '.*Close.*'
    commands:
      - tapOn:
          text: '.*Close.*'
      - waitForAnimationToEnd:
          timeout: 3000

# Sign in as a seeded player, so the shots show the app rather than the login
# screen. Inlined rather than shared with the smoke suite's fragments: the
# harness writes a RESOLVED copy of this file to `.flow-shots/`, so a relative
# `runFlow` would be resolved from there and miss.
- extendedWaitUntil:
    visible: '.*Developer menu.*'
    timeout: 240000
- tapOn: '.*Developer menu.*'
- extendedWaitUntil:
    visible: '.*Accounts and roles.*'
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 5000
- repeat:
    times: 20
    while:
      notVisible: '.*${PLAYER_EMAIL}.*'
    commands:
      - swipe:
          start: 50%, 70%
          end: 50%, 50%
          duration: 900
      - waitForAnimationToEnd:
          timeout: 2500
- swipe:
    start: 50%, 65%
    end: 50%, 55%
    duration: 900
- waitForAnimationToEnd:
    timeout: 2500
- tapOn: '.*${PLAYER_EMAIL}.*'
- waitForAnimationToEnd:
    timeout: 3000
# Close the dev menu. Signing in does NOT dismiss it: the session changes
# underneath, the menu stays exactly where it is, and the account row simply
# becomes the highlighted one. So there is nothing to wait for until the menu is
# out of the way, and waiting for the player home while it is still open can
# never pass.
- tapOn:
    text: '.*Close.*'
- waitForAnimationToEnd:
    timeout: 3000

# Mounting the player area asks about notifications before the system dialog, and
# that sheet can land AFTER the first render, covering the very title being waited
# on. Loop rather than tap once.
- repeat:
    times: 6
    while:
      notVisible: '.*${HOME_TITLE}.*'
    commands:
      - tapOn:
          text: '^${PUSH_DECLINE}$'
          optional: true
      - tapOn:
          text: '.*Close.*'
          optional: true
      - waitForAnimationToEnd:
          timeout: 3000
# The OUTCOME, not the dev menu's "Signed in as ..." line: that line is local
# component state rendered after the whole account list, so it sits below the row
# just tapped and waiting never brings it into view. Landing on the player home
# cannot happen without a session.
- extendedWaitUntil:
    visible: '.*${HOME_TITLE}.*'
    timeout: 120000

# Pin Catalan and relaunch, so the baseline is a real left-to-right start rather
# than whatever the device happened to be set to.
- repeat:
    times: 20
    while:
      notVisible: '^ca \(ltr\)$'
    commands:
      - swipe:
          start: 50%, 70%
          end: 50%, 50%
          duration: 900
      - waitForAnimationToEnd:
          timeout: 2500
- swipe:
    start: 50%, 65%
    end: 50%, 55%
    duration: 900
- waitForAnimationToEnd:
    timeout: 2500
- tapOn:
    text: '^ca \(ltr\)$'
- waitForAnimationToEnd:
    timeout: 3000
- assertVisible:
    text: '^ca \(ltr\)$'
    selected: true
- stopApp
- openLink: ${DEV_CLIENT_URL}
# iOS asks "Open in <app>?" before it will follow a custom-scheme link, and
# nothing dismisses that for you: the app never opens and the flow times out on
# its first assertion, which reads as a bundle that would not load. Optional so
# the identical line is a harmless no-op on Android, which does not ask.
- tapOn:
    text: '^Open$'
    optional: true
- waitForAnimationToEnd:
    timeout: 3000
- waitForAnimationToEnd:
    timeout: 12000
- repeat:
    times: 10
    while:
      notVisible: '^${TAB_HOME}$'
    commands:
      - tapOn:
          text: '.*Close.*'
          optional: true
      - tapOn:
          text: '^${PUSH_DECLINE}$'
          optional: true
      - waitForAnimationToEnd:
          timeout: 3000
- extendedWaitUntil:
    visible: '^${TAB_HOME}$'
    timeout: 240000
- waitForAnimationToEnd:
    timeout: 3000

# 1. Catalan, left to right.
- takeScreenshot: ${SHOTS}/01-ca

# 2. The switcher itself, so the canvas shows WHERE this lives and that all five
# languages are offered, each labelled with its own reading direction.
- tapOn:
    text: '^${TAB_PROFILE}$'
- waitForAnimationToEnd:
    timeout: 3000
- tapOn: '.*Developer menu.*'
- extendedWaitUntil:
    visible: '.*Environment.*'
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 5000
- repeat:
    times: 20
    while:
      notVisible: '^ar \(rtl\)$'
    commands:
      - swipe:
          start: 50%, 70%
          end: 50%, 50%
          duration: 900
      - waitForAnimationToEnd:
          timeout: 2500
- swipe:
    start: 50%, 65%
    end: 50%, 55%
    duration: 900
- waitForAnimationToEnd:
    timeout: 2500
- takeScreenshot: ${SHOTS}/02-switcher

# 3. Arabic chosen, but BEFORE the restart: the labels are already Arabic while
# the layout is still left to right. This is the state that confuses everyone,
# which is exactly why it is worth a screenshot.
- tapOn:
    text: '^ar \(rtl\)$'
- waitForAnimationToEnd:
    timeout: 3000
- assertVisible:
    text: '^ar \(rtl\)$'
    selected: true
- takeScreenshot: ${SHOTS}/03-ar-before-restart

# 4. After the restart: the layout has mirrored too.
- stopApp
- openLink: ${DEV_CLIENT_URL}
# iOS asks "Open in <app>?" before it will follow a custom-scheme link, and
# nothing dismisses that for you: the app never opens and the flow times out on
# its first assertion, which reads as a bundle that would not load. Optional so
# the identical line is a harmless no-op on Android, which does not ask.
- tapOn:
    text: '^Open$'
    optional: true
- waitForAnimationToEnd:
    timeout: 3000
- waitForAnimationToEnd:
    timeout: 12000
- repeat:
    times: 10
    while:
      notVisible: '^${TAB_HOME_AR}$'
    commands:
      - tapOn:
          text: '.*Close.*'
          optional: true
      - waitForAnimationToEnd:
          timeout: 3000
- extendedWaitUntil:
    visible: '^${TAB_HOME_AR}$'
    timeout: 240000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: ${SHOTS}/04-ar-after-restart

# 5. The readout that proves it, rather than asking anyone to eyeball a mirror:
# the dev menu renders "matches the language" only when `I18nManager.isRTL`
# agrees with the resolved direction.
- tapOn:
    text: '^${TAB_PROFILE_AR}$'
- waitForAnimationToEnd:
    timeout: 3000
- tapOn: '.*Developer menu.*'
- extendedWaitUntil:
    visible: '.*Environment.*'
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 5000
- repeat:
    times: 20
    while:
      notVisible: '.*Native layout direction matches the language..*'
    commands:
      - swipe:
          start: 50%, 70%
          end: 50%, 50%
          duration: 900
      - waitForAnimationToEnd:
          timeout: 2500
- waitForAnimationToEnd:
    timeout: 3000
- assertVisible: '.*Native layout direction matches the language..*'
- takeScreenshot: ${SHOTS}/05-direction-readout

# Leave the device in Catalan. A switch that cannot be undone is its own bug, and
# the next flow to run should not inherit Arabic.
- repeat:
    times: 20
    while:
      notVisible: '^ca \(ltr\)$'
    commands:
      - swipe:
          start: 50%, 70%
          end: 50%, 50%
          duration: 900
      - waitForAnimationToEnd:
          timeout: 2500
- swipe:
    start: 50%, 65%
    end: 50%, 55%
    duration: 900
- waitForAnimationToEnd:
    timeout: 2500
- tapOn:
    text: '^ca \(ltr\)$'
- waitForAnimationToEnd:
    timeout: 3000
- assertVisible:
    text: '^ca \(ltr\)$'
    selected: true
