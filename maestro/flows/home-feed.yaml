appId: com.ramassa.app
name: home-feed
env:
  SHOTS: maestro/shots/home-feed/ca/ios
  SUFFIX: ''
  LOCALE: ca
  DEV_CLIENT_URL: ramassa://expo-development-client/?url=http%3A%2F%2Flocalhost%3A8081
  PLAYER_EMAIL: '{{player:email}}'
  HOME_TITLE: '{{home:feedTitle}}'
  PUSH_DECLINE: '{{push:rationaleDecline}}'
  FILTER_ALL: '{{home:filterAll}}'
  FILTER_INFO: '{{home:category.info}}'
  FILTER_TRAINING: '{{home:category.training}}'
  FILTER_SOCIAL: '{{home:category.social}}'
  FILTER_URGENT: '{{home:category.urgent}}'
  PINNED: '{{home:pinned}}'
  EMPTY_TITLE: '{{home:emptyTitle}}'
  OFFLINE_BANNER: '{{home:offlineBanner}}'
  BACK: '{{common:back}}'
---
# Start clean, pin the requested language through the local development menu,
# sign in as the seeded player, then relaunch so right-to-left layout is honest.
- clearState
- openLink: ${DEV_CLIENT_URL}
- tapOn:
    text: '^Open$'
    optional: true
- waitForAnimationToEnd:
    timeout: 3000
- extendedWaitUntil:
    visible: '.*Developer menu.*'
    timeout: 240000
- waitForAnimationToEnd:
    timeout: 12000
- repeat:
    times: 4
    while:
      visible: '.*Close.*'
    commands:
      - tapOn: '.*Close.*'
      - waitForAnimationToEnd:
          timeout: 3000
- repeat:
    times: 6
    while:
      notVisible: '.*Environment.*'
    commands:
      - tapOn:
          text: '.*Developer menu.*'
          optional: true
      - waitForAnimationToEnd:
          timeout: 3000
- waitForAnimationToEnd:
    timeout: 5000
- repeat:
    times: 20
    while:
      notVisible: '^${LOCALE} \(.*\)$'
    commands:
      - swipe:
          start: 50%, 70%
          end: 50%, 50%
          duration: 900
      - waitForAnimationToEnd:
          timeout: 2500
- repeat:
    times: 6
    while:
      notVisible:
        text: '^${LOCALE} \(.*\)$'
        selected: true
    commands:
      - tapOn:
          text: '^${LOCALE} \(.*\)$'
          optional: true
      - waitForAnimationToEnd:
          timeout: 2500
- assertVisible:
    text: '^${LOCALE} \(.*\)$'
    selected: true
- repeat:
    times: 6
    while:
      visible: '.*Close.*'
    commands:
      - tapOn:
          text: '.*Close.*'
          optional: true
      - waitForAnimationToEnd:
          timeout: 3000
- repeat:
    times: 6
    while:
      notVisible: '.*Accounts and roles.*'
    commands:
      - tapOn:
          text: '.*Developer menu.*'
          optional: true
      - waitForAnimationToEnd:
          timeout: 3000
- waitForAnimationToEnd:
    timeout: 5000
- repeat:
    times: 20
    while:
      notVisible: '.*${PLAYER_EMAIL}.*'
    commands:
      - swipe:
          start: 50%, 70%
          end: 50%, 50%
          duration: 900
      - waitForAnimationToEnd:
          timeout: 2500
- swipe:
    start: 50%, 65%
    end: 50%, 55%
    duration: 900
- waitForAnimationToEnd:
    timeout: 2500
- tapOn: '.*${PLAYER_EMAIL}.*'
- waitForAnimationToEnd:
    timeout: 3000
- repeat:
    times: 8
    while:
      notVisible: '.*${HOME_TITLE}.*'
    commands:
      - tapOn:
          text: '^${PUSH_DECLINE}$'
          optional: true
      - tapOn:
          text: '.*Close.*'
          optional: true
      - waitForAnimationToEnd:
          timeout: 3000
- extendedWaitUntil:
    visible: '.*${HOME_TITLE}.*'
    timeout: 120000
- stopApp
- openLink: ${DEV_CLIENT_URL}
- tapOn:
    text: '^Open$'
    optional: true
- waitForAnimationToEnd:
    timeout: 12000
- repeat:
    times: 10
    while:
      notVisible: '.*${HOME_TITLE}.*'
    commands:
      - tapOn:
          text: '.*Close.*'
          optional: true
      - tapOn:
          text: '^${PUSH_DECLINE}$'
          optional: true
      - waitForAnimationToEnd:
          timeout: 3000
- extendedWaitUntil:
    visible: '.*${HOME_TITLE}.*'
    timeout: 240000
- waitForAnimationToEnd:
    timeout: 3000

# Populated hub with the pinned cancellation first.
- takeScreenshot: ${SHOTS}/01-feed${SUFFIX}

# Pull to refresh from the top. Shoot immediately while the native indicator is
# visible, then let the request settle before changing the filter.
- swipe:
    start: 50%, 28%
    end: 50%, 72%
    duration: 900
- takeScreenshot: ${SHOTS}/02-refresh${SUFFIX}
- waitForAnimationToEnd:
    timeout: 4000

# Urgent branch and the announcement detail.
- tapOn: '^${FILTER_URGENT}$'
- assertVisible:
    text: '^${FILTER_URGENT}$'
    selected: true
- waitForAnimationToEnd:
    timeout: 1500
- takeScreenshot: ${SHOTS}/03-urgent${SUFFIX}
- tapOn: '.*${PINNED}.*'
- extendedWaitUntil:
    visible: '^${BACK}$'
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 1500
- takeScreenshot: ${SHOTS}/04-detail${SUFFIX}
# Under RTL on Android the in-screen back button sits under the development
# client's floating gear. Use the system back there, and the visible control on
# iOS. Close the tools sheet if an intercepted tap opened it.
- repeat:
    times: 6
    while:
      notVisible: '.*${HOME_TITLE}.*'
    commands:
      - tapOn:
          text: '.*Close.*'
          optional: true
      - runFlow:
          when:
            platform: Android
          commands:
            - back
      - tapOn:
          text: '^${BACK}$'
          optional: true
      - waitForAnimationToEnd:
          timeout: 2500
- extendedWaitUntil:
    visible: '.*${HOME_TITLE}.*'
    timeout: 30000

# Each category is visible without a hidden overflow menu. The seeded social
# category is populated; training and information prove the empty state.
- tapOn: '^${FILTER_SOCIAL}$'
- assertVisible:
    text: '^${FILTER_SOCIAL}$'
    selected: true
- waitForAnimationToEnd:
    timeout: 1500
- takeScreenshot: ${SHOTS}/05-social${SUFFIX}
- tapOn: '^${FILTER_TRAINING}$'
- extendedWaitUntil:
    visible: '.*${EMPTY_TITLE}.*'
    timeout: 30000
- takeScreenshot: ${SHOTS}/06-training${SUFFIX}
- tapOn: '^${FILTER_INFO}$'
- extendedWaitUntil:
    visible: '.*${EMPTY_TITLE}.*'
    timeout: 30000
- takeScreenshot: ${SHOTS}/07-info${SUFFIX}

# Android can enter real airplane mode. The feed was loaded before disconnect,
# so this proves the cached rows remain present under the translated notice.
- runFlow:
    when:
      platform: Android
    commands:
      - tapOn: '^${FILTER_ALL}$'
      - setAirplaneMode: enabled
      - extendedWaitUntil:
          visible: '.*${OFFLINE_BANNER}.*'
          timeout: 30000
      - takeScreenshot: ${SHOTS}/08-offline${SUFFIX}
      - setAirplaneMode: disabled

# The same validated app route used by an announcement notification response.
# The system shade is captured separately when the platform exposes it reliably.
- openLink: ramassa://announcement/5eed0000-0000-4000-8001-000000000002
- extendedWaitUntil:
    visible: '^${BACK}$'
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 1500
- takeScreenshot: ${SHOTS}/09-push-entry${SUFFIX}
